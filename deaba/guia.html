<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DEAba · Guía del profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="deaba.css">
<style>
main.wrap { max-width: 900px; }
.doc { display: flex; flex-direction: column; gap: 22px; }
.doc h2 { border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.doc ul, .doc ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .92rem; }
.meta dt { color: var(--muted); } .meta dd { margin: 0; }
.ficha { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; break-inside: avoid; font-size: .9rem; display: flex; flex-direction: column; gap: 3px; background: var(--surface); }
.fichas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ficha .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.ficha .k { color: var(--muted); }
.conf { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 6px 10px; font-size: .85rem; font-weight: 500; }
@media (max-width: 640px) { .fichas { grid-template-columns: 1fr; } }
@media print {
  @page { size: A4; margin: 15mm 14mm; }
  :root { --bg: #fff; --surface: #fff; --sunk: #f1f1ee; --ink: #111; --muted: #555; --line: #ccc; color-scheme: light; }
  body { font-size: 10.5pt; } header.bar, footer, .noprint { display: none !important; } main { padding: 0; }
  .doc { gap: 14px; } h1 { font-size: 20pt; } h2 { font-size: 13pt; break-after: avoid; } .fc { border: 1px solid #ccc; }
  table { font-size: 9pt; } tr, .ficha { break-inside: avoid; }
}
</style>
</head>
<body>
<header class="bar"><div class="wrap"><a class="mark" href="panel.html">DEABA<small>Guía del profesor</small></a><span class="spacer"></span><div class="lang noprint" role="group" aria-label="Idioma / Language"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div><button class="btn small" onclick="print()">PDF</button></div></header>
<main class="wrap" id="main"><p class="muted">Cargando…</p></main>
<footer><div class="wrap">DEAba Digital · guía del profesor · BIOCOGNIA</div></footer>
<script src="../quaestia/firebase-config.js"></script>
<script src="deaba.js?v=0.2.3"></script>
<script>
"use strict";
// Guía bilingüe: lo que no esté traducido se muestra en español.
let LANG = new URLSearchParams(location.search).get("lang") || dbLang();
const L = (x) => dbT(x, LANG);
const G = {
  es: { conf: "Material del profesorado: no lo compartas con el alumnado antes del plenario.", tipo: (n) => `tipo ${n}`, t1: "interpretar el experimento", t2: "diseñar el experimento",
    id: "Identificador", nivel: "Nivel", asig: "Asignatura", obj: "Objetivo", tareas: "Tareas", aut: "Autoría", niv: { low: "básico", medium: "intermedio", high: "avanzado" },
    ctx: "Contexto que ven los grupos", mol: "Molécula", tp: "Tipo", diag: "Respuesta esperada", pistas: "Pistas de entrada", raz: "Razonamiento esperado",
    fm: "Ficha de cada molécula", fk: "Ficha de cada marcador del catálogo", alt: "Interpretaciones alternativas válidas", err: "Errores frecuentes", plen: "Preguntas para el plenario",
    rub: "Rúbrica orientativa", conc: "Conceptos que busca el panel", conc_d: "El panel los señala en las respuestas para orientar el plenario; no corrige.", notas: "Notas", refs: "Referencias",
    ruta: "Ruta", comp: "Compartimento", porque: () => "Por qué cambia", cond: "Condición", papel: "Papel", com: "Comentario",
    piden: (e, m, a, b) => `Se piden ${e} enzimas y ${m} metabolitos. Fold change de cada marcador en la comparación de referencia: ${a} / ${b}.`,
    nog: "No se ha podido cargar la guía. Entra primero en el panel del profesorado con una cuenta autorizada y comprueba que la guía de esta actividad está subida.", noact: (i) => `No se ha podido cargar la actividad «${i}».`,
    PAPEL: { clave: "clave", apoyo: "apoyo", distractor: "distractor", referencia_1: "referencia (condición 1)", referencia_2: "referencia (condición 2)", valida: "válida", debil: "débil" },
    rub1: (p, r) => `<ul><li><b>Reacciones (${p[0]}):</b> ${r(p[0])} por molécula con la reacción correcta (sustratos y productos, o la enzima que forma o consume el metabolito).</li><li><b>Rutas (${p[1]}):</b> ${r(p[1])} por molécula situada en una ruta correcta (cualquiera de las de la ficha).</li><li><b>Diagnóstico (${p[2]}):</b> identificación de la condición (1) e integración razonada del patrón (3): regulación, flujo del carbono entre rutas y compartimentos, y los datos que descartan las alternativas.</li></ul>`,
    rub2: (p, r) => `<ul><li><b>Condiciones (${p[0]}):</b> comparación de referencia o válida y bien justificada, ${p[0]}; comparación débil, entre 1 y 2 según la justificación; una condición propia se valora por su justificación.</li><li><b>Enzimas, reacciones y rutas (${p[1]}):</b> ${r(p[1])} por marcador pertinente con su reacción y su ruta. Un distractor no puntúa.</li><li><b>Fold change (${p[2]}):</b> ${r(p[2])} por marcador con la dirección correcta para la comparación elegida y una magnitud razonable; se valora que incluyan marcadores que bajen.</li></ul>` },
  en: { conf: "Teaching material: do not share it with students before the plenary.", tipo: (n) => `type ${n}`, t1: "interpret the experiment", t2: "design the experiment",
    id: "Identifier", nivel: "Level", asig: "Course", obj: "Aim", tareas: "Tasks", aut: "Author", niv: { low: "basic", medium: "intermediate", high: "advanced" },
    ctx: "Context shown to groups", mol: "Molecule", tp: "Type", diag: "Expected answer", pistas: "Entry clues", raz: "Expected reasoning",
    fm: "Card for each molecule", fk: "Card for each marker in the catalogue", alt: "Valid alternative interpretations", err: "Common errors", plen: "Questions for the plenary",
    rub: "Suggested rubric", conc: "Concepts the panel looks for", conc_d: "The panel highlights them in the answers to steer the plenary; it does not mark anything.", notas: "Notes", refs: "References",
    ruta: "Pathway", comp: "Compartment", porque: () => "Why it changes", cond: "Condition", papel: "Role", com: "Comment",
    piden: (e, m, a, b) => `Groups choose ${e} enzymes and ${m} metabolites. Fold change of each marker in the reference comparison: ${a} / ${b}.`,
    nog: "The guide could not be loaded. Sign in to the teachers' panel with an authorised account first and check that this activity's guide has been uploaded.", noact: (i) => `The activity “${i}” could not be loaded.`,
    PAPEL: { clave: "key", apoyo: "support", distractor: "distractor", referencia_1: "reference (condition 1)", referencia_2: "reference (condition 2)", valida: "valid", debil: "weak" },
    rub1: (p, r) => `<ul><li><b>Reactions (${p[0]}):</b> ${r(p[0])} per molecule with the correct reaction (substrates and products, or the enzyme that makes or uses the metabolite).</li><li><b>Pathways (${p[1]}):</b> ${r(p[1])} per molecule placed in a correct pathway (any of those on its card).</li><li><b>Diagnosis (${p[2]}):</b> identifying the condition (1) and a reasoned integration of the pattern (3): regulation, carbon flow between pathways and compartments, and the data that rule out the alternatives.</li></ul>`,
    rub2: (p, r) => `<ul><li><b>Conditions (${p[0]}):</b> a reference or valid comparison, well justified, ${p[0]}; a weak comparison, 1 to 2 depending on the justification; an own condition is marked on its justification.</li><li><b>Enzymes, reactions and pathways (${p[1]}):</b> ${r(p[1])} per relevant marker with its reaction and pathway. A distractor scores nothing.</li><li><b>Fold change (${p[2]}):</b> ${r(p[2])} per marker with the correct direction for the chosen comparison and a reasonable magnitude; including markers that go down is valued.</li></ul>` },
};
const T = (k, ...a) => { const v = G[LANG][k]; return typeof v === "function" ? v(...a) : v; };
const lista = (xs, ord) => xs && xs.length ? `<${ord ? "ol" : "ul"}>${xs.map((x) => `<li>${esc(L(x))}</li>`).join("")}</${ord ? "ol" : "ul"}>` : `<p class="muted">—</p>`;
function fcTxt(fc) { const d = dbDir(fc); return `<span class="fc ${d === "sube" ? "up" : d === "baja" ? "down" : "eq"}">${dbFmtFC(fc, LANG)}</span>`; }
function rubrica(a) {
  const p = a.puntos, n = a.tipo === 1 ? a.moleculas.length : a.n_enzimas + a.n_metabolitos, r = (x) => { const v = String(Math.round((x / n) * 100) / 100); return LANG === "en" ? v : v.replace(".", ","); };
  return a.tipo === 1 ? T("rub1", p, r) : T("rub2", p, r);
}
let ACT = null, GUIA = null;
function pintar() {
  document.documentElement.lang = LANG;
  for (const b of document.querySelectorAll(".lang button")) b.setAttribute("aria-pressed", b.dataset.lang === LANG);
  const act = ACT, g = GUIA, S = g.secciones, t = dbTareas(act, LANG);
  document.title = `${LANG === "en" ? "Guide" : "Guía"} · ${L(act.titulo)}`;
  let datos = "", fichas = "";
  if (act.tipo === 1) {
    datos = `<div class="tablebox"><table><thead><tr><th>Id</th><th>${T("mol")}</th><th>${T("tp")}</th><th class="n">FC</th></tr></thead><tbody>${act.moleculas.map((m) => `<tr><td class="num">${esc(m.id)}</td><td>${esc(L(m.nombre))}</td><td>${LANG === "en" ? (m.tipo === "enzima" ? "enzyme" : "metabolite") : m.tipo}</td><td class="n">${fcTxt(m.fc)}</td></tr>`).join("")}</tbody></table></div>
      <p class="small muted">FC = ${esc(L(act.condiciones.c1))} / ${esc(L(act.condiciones.c2))}.</p>`;
    fichas = act.moleculas.map((m) => { const k = g.moleculas[m.id] || {};
      return `<div class="ficha"><div class="t"><b>${esc(m.id)}. ${esc(L(m.nombre))}</b>${fcTxt(m.fc)}</div><div>${esc(L(k.reaccion))}</div>
        <div><span class="k">${T("ruta")}:</span> ${(k.rutas || []).map((r) => esc(dbRuta(r, LANG))).join(" · ")} · <span class="k">${T("comp")}:</span> ${esc(L(k.compartimento))}</div><div><span class="k">${T("porque", m.fc > 0)}:</span> ${esc(L(k.porque))}</div></div>`; }).join("");
  } else {
    const ref = Object.entries(g.condiciones).filter(([, c]) => c.papel.startsWith("referencia")).sort((a, b) => a[1].papel.localeCompare(b[1].papel)).map(([i]) => i);
    const nom = (cid) => L((act.condiciones.find((c) => c.id === cid) || {}).nombre);
    datos = `<div class="tablebox"><table><thead><tr><th>${T("cond")}</th><th>${T("papel")}</th><th>${T("com")}</th></tr></thead><tbody>${act.condiciones.map((c) => `<tr><td>${esc(L(c.nombre))}</td><td>${T("PAPEL")[g.condiciones[c.id].papel]}</td><td>${esc(L(g.condiciones[c.id].comentario))}</td></tr>`).join("")}</tbody></table></div>
      <p class="small muted">${esc(T("piden", act.n_enzimas, act.n_metabolitos, nom(ref[0]), nom(ref[1])))}</p>`;
    fichas = act.catalogo.map((m) => { const k = g.marcadores[m.id], fc = dbFC(k.niveles[ref[0]], k.niveles[ref[1]]);
      return `<div class="ficha"><div class="t"><b>${esc(L(m.nombre))}</b><span class="pill ${k.papel === "clave" ? "ok" : k.papel === "distractor" ? "bad" : ""}">${T("PAPEL")[k.papel]}</span>${fc === null ? `<span class="fc eq">n.d.</span>` : fcTxt(fc)}</div><div>${esc(L(k.reaccion))}</div>
        <div><span class="k">${T("ruta")}:</span> ${(k.rutas || []).map((r) => esc(dbRuta(r, LANG))).join(" · ")} · <span class="k">${T("comp")}:</span> ${esc(L(k.compartimento))}</div><div>${esc(L(k.porque))}</div></div>`; }).join("");
  }
  const et = (c) => (LANG === "en" && c.etiqueta_en) || c.etiqueta;
  $("#main").innerHTML = `<article class="doc"><p class="conf">${T("conf")}</p>
    <div class="stack"><p class="eyebrow">DEAba · ${T("tipo", act.tipo)} · ${act.tipo === 1 ? T("t1") : T("t2")}</p><h1>${esc(L(act.titulo))}</h1></div>
    <dl class="meta"><dt>${T("id")}</dt><dd class="num">${esc(act.id)}</dd><dt>${T("nivel")}</dt><dd>${T("niv")[act.nivel] || act.nivel}${L(g.nivel_texto) ? ` · ${esc(L(g.nivel_texto))}` : ""}</dd>${act.asignatura ? `<dt>${T("asig")}</dt><dd>${esc(act.asignatura)}</dd>` : ""}
      <dt>${T("obj")}</dt><dd>${esc(L(g.objetivo))}</dd><dt>${T("tareas")}</dt><dd>${t.map((x, i) => `${esc(x)} (${act.puntos[i]})`).join(" · ")}</dd>${act.autor ? `<dt>${T("aut")}</dt><dd>${esc(act.autor)}</dd>` : ""}${dbCita(act, LANG) ? `<dt>${LANG === "en" ? "How to cite" : "Cómo citar"}</dt><dd class="small">${esc(dbCita(act, LANG))}</dd>` : ""}</dl>
    <section class="stack"><h2>${T("ctx")}</h2><p>${esc(L(act.contexto))}</p><p><b>${esc(L(act.mision))}</b></p>${datos}</section>
    <section class="stack"><h2>${T("diag")}</h2>${lista(S.diagnostico)}</section>
    <section class="stack"><h2>${T("pistas")}</h2>${lista(S.pistas)}</section>
    <section class="stack"><h2>${T("raz")}</h2>${lista(S.razonamiento, true)}</section>
    <section class="stack"><h2>${act.tipo === 1 ? T("fm") : T("fk")}</h2><div class="fichas">${fichas}</div></section>
    <section class="stack"><h2>${T("alt")}</h2>${lista(S.alternativas)}</section>
    <section class="stack"><h2>${T("err")}</h2>${lista(S.errores)}</section>
    <section class="stack"><h2>${T("plen")}</h2>${lista(S.plenario)}</section>
    <section class="stack"><h2>${T("rub")}</h2>${rubrica(act)}</section>
    ${g.conceptos.length ? `<section class="stack"><h2>${T("conc")}</h2><p class="small muted">${T("conc_d")}</p><ul>${g.conceptos.map((c) => `<li><b>${esc(et(c))}</b>${c.tipo !== "esperado" ? ` (${c.tipo})` : ""}: <span class="small muted">${c.alternativas.map((a) => a.join(" + ")).join(" · ")}</span></li>`).join("")}</ul></section>` : ""}
    ${S.notas && S.notas.length ? `<section class="stack"><h2>${T("notas")}</h2>${lista(S.notas)}</section>` : ""}
    <section class="stack"><h2>${T("refs")}</h2>${lista(S.referencias)}</section></article>`;
}
document.addEventListener("click", (e) => { const b = e.target.closest(".lang button"); if (b && ACT && GUIA) { LANG = b.dataset.lang; pintar(); } });
(async function () {
  const id = new URLSearchParams(location.search).get("a");
  try {
    await Promise.all([dbCargarRutas(), dbCargarColeccion()]);
    if (!DBB.demo) await DBB.init().catch(() => {});
    ACT = await dbActividad(id);
    GUIA = await DBB.guia(id);
    if (!GUIA) { $("#main").innerHTML = `<section class="panel stack"><h1>${esc(L(ACT.titulo))}</h1><p>${T("nog")}</p></section>`; return; }
    pintar();
  } catch (e) { $("#main").innerHTML = `<p class="notice">${esc(T("noact", id))}</p>`; }
})();
</script>
</body>
</html>
