<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="QUAESTIA: autoevaluación de Bioquímica metabólica basada en la taxonomía de Bloom (BIOCOGNIA).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230e6b5c%22/%3E%3Ctext x=%2216%22 y=%2223%22 font-family=%22Georgia,serif%22 font-size=%2220%22 font-weight=%22600%22 fill=%22white%22 text-anchor=%22middle%22%3EQ%3C/text%3E%3C/svg%3E">
<title>QUAESTIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: una columna de lectura (~68ch) bajo una barra fija; el nivel de Bloom (B1→B6) es el hilo de color de toda la app. */
:root {
  --bg: #f4f7f6;
  --surface: #ffffff;
  --sunk: #e8eeec;
  --ink: #142824;
  --muted: #56706a;
  --line: #cdd9d5;
  --accent: #0e6b5c;
  --accent-ink: #ffffff;
  --ok: #1f7a3f;
  --ok-bg: #e2f2e7;
  --bad: #b3261e;
  --bad-bg: #fbe5e3;
  --warn-bg: #fff4d6;
  --b1: #3d6fb6; --b2: #2f8a9a; --b3: #3a9364; --b4: #b08a1f; --b5: #c26a2b; --b6: #a8406b;
  --f-display: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a18; --surface: #162421; --sunk: #1d2e2b; --ink: #e3ece9; --muted: #93aaa4; --line: #2c403c;
    --accent: #4fc2ab; --accent-ink: #062520; --ok: #6fd18f; --ok-bg: #173327; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn-bg: #352d14;
    --b1: #7aa4e6; --b2: #62bccb; --b3: #6cc591; --b4: #dcb54e; --b5: #ee9a5e; --b6: #e27aa3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a18; --surface: #162421; --sunk: #1d2e2b; --ink: #e3ece9; --muted: #93aaa4; --line: #2c403c;
  --accent: #4fc2ab; --accent-ink: #062520; --ok: #6fd18f; --ok-bg: #173327; --bad: #ff8a80; --bad-bg: #3a1d1b; --warn-bg: #352d14;
  --b1: #7aa4e6; --b2: #62bccb; --b3: #6cc591; --b4: #dcb54e; --b5: #ee9a5e; --b6: #e27aa3;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra superior */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
header.bar .wrap { max-width: 1060px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.mark { font-family: var(--f-display); font-weight: 600; font-size: 1.25rem; letter-spacing: 0.14em; background: none; border: 0; padding: 0; cursor: pointer; }
.mark small { display: block; font-family: var(--f-ui); font-weight: 400; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
nav.main button { background: none; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); font-size: 0.92rem; }
nav.main button[aria-current="page"] { color: var(--ink); background: var(--sunk); font-weight: 500; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 9px; cursor: pointer; font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; line-height: 1.25; margin: 0; }
h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
p { margin: 0; max-width: 68ch; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 32px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.muted { color: var(--muted); }
.small { font-size: 0.86rem; }
.eyebrow { font-size: 0.74rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: none; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; }
.notice { background: var(--warn-bg); border-radius: var(--r); padding: 14px 16px; }

/* Inicio */
.hero { display: grid; gap: 14px; padding-block: 8px 4px; }
.hero h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.mode { text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.mode:hover { border-color: var(--accent); }
.mode h3 { font-size: 1.1rem; }
.mode .go { margin-top: auto; color: var(--accent); font-weight: 500; font-size: 0.92rem; }
.bloombar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; }
.bloombar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
table.temas { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
table.temas td, table.temas th { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.temas th { font-weight: 500; color: var(--muted); font-size: 0.8rem; }
table.temas td.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tablebox { overflow-x: auto; }

/* Chips de Bloom */
.bl { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.78rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.bl[data-b="B1"] { color: var(--b1); } .bl[data-b="B2"] { color: var(--b2); } .bl[data-b="B3"] { color: var(--b3); }
.bl[data-b="B4"] { color: var(--b4); } .bl[data-b="B5"] { color: var(--b5); } .bl[data-b="B6"] { color: var(--b6); }

/* Formularios de configuración */
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--accent); }
.check:has(input:checked) { border-color: var(--accent); background: var(--sunk); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg label { padding: 7px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.blchecks { display: flex; flex-wrap: wrap; gap: 8px; }
.blchecks label { cursor: pointer; }
.blchecks input { position: absolute; opacity: 0; pointer-events: none; }
.blchecks label:has(input:checked) .bl { background: currentColor; }
.blchecks label:has(input:checked) .bl span { color: var(--surface); }
.blchecks label:has(input:focus-visible) .bl { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Pregunta */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.progress { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.stem { font-family: var(--f-display); font-size: 1.14rem; line-height: 1.6; max-width: 68ch; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; text-align: left; }
.opt .letter { font-family: var(--f-mono); font-weight: 500; width: 1.6em; height: 1.6em; display: grid; place-items: center; border-radius: 5px; border: 1px solid var(--line); font-size: 0.85rem; }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt[aria-pressed="true"] .letter { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.is-correct { background: var(--ok-bg); border-color: var(--ok); }
.opt.is-wrong { background: var(--bad-bg); border-color: var(--bad); }
.opt .tag { font-size: 0.78rem; font-weight: 500; white-space: nowrap; }
.opt.is-correct .tag { color: var(--ok); } .opt.is-wrong .tag { color: var(--bad); }
.opt:disabled { cursor: default; color: inherit; }
.hint { min-height: 1.4em; font-size: 0.88rem; color: var(--bad); }
.explain { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; }
.grid50 { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 5px; }
.grid50 button { font-family: var(--f-mono); font-size: 0.78rem; padding: 5px 0; border: 1px solid var(--line); background: var(--surface); border-radius: 5px; cursor: pointer; }
.grid50 button.done { background: var(--sunk); border-color: var(--muted); }
.grid50 button.here { outline: 2px solid var(--accent); outline-offset: 1px; }
.navrow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding: 12px 14px; border-radius: 8px; background: var(--warn-bg); }

/* Resultados */
.score { display: flex; gap: 28px; flex-wrap: wrap; align-items: flex-end; }
.score .big { font-family: var(--f-display); font-size: clamp(2.8rem, 9vw, 4rem); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 0.4em; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px 20px; flex: 1; min-width: 0; }
.kv div { display: flex; flex-direction: column; }
.kv b { font-family: var(--f-mono); font-size: 1.1rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.kv span { font-size: 0.8rem; color: var(--muted); }
.bars { display: grid; gap: 8px; }
.bars .r { display: grid; grid-template-columns: 7.5rem 1fr 3.4rem; gap: 10px; align-items: center; font-size: 0.88rem; }
.bars .track { height: 10px; background: var(--sunk); border-radius: 5px; overflow: hidden; }
.bars .track span { display: block; height: 100%; border-radius: 5px; }
.bars .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 0.82rem; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.review summary { cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; }
.review summary::-webkit-details-marker { display: none; }
.review .pts { font-family: var(--f-mono); font-variant-numeric: tabular-nums; margin-left: auto; font-size: 0.86rem; }
.pts.pos { color: var(--ok); } .pts.neg { color: var(--bad); } .pts.zero { color: var(--muted); }
.review .body { padding-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.review ol { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 0.93rem; }
.review li { padding: 4px 8px; border-radius: 5px; }
.review li.c { background: var(--ok-bg); }
.review li.w { background: var(--bad-bg); }

/* Preguntas cortas */
textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); resize: vertical; line-height: 1.5; }
.answer { background: var(--sunk); border-radius: 8px; padding: 14px 16px; }
select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; }

/* Consentimiento */
.consent { border: 1px solid var(--accent); border-radius: var(--r); background: var(--surface); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 500; }
.pill.on { background: var(--ok-bg); color: var(--ok); } .pill.off { background: var(--sunk); color: var(--muted); }
.spark { width: 100%; height: 80px; display: block; }
footer a { color: inherit; }
footer { border-top: 1px solid var(--line); padding-block: 22px; color: var(--muted); font-size: 0.84rem; }
footer .wrap { display: flex; flex-direction: column; gap: 6px; }
.sub-badge { font-size: 0.74rem; padding: 1px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--ink); }
sub, sup { font-size: 0.72em; line-height: 0; }

/* Profesorado */
.field { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.chip { cursor: pointer; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; min-width: 2.2em; text-align: center; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-family: var(--f-mono); font-size: 0.85rem; background: var(--surface); }
.chip input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.qrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 0.92rem; }
.qrow .qtext { flex: 1 1 260px; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.small-btn { padding: 4px 10px; font-size: 0.85rem; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; align-items: end; }
.optrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chk input { accent-color: var(--accent); width: 1.1em; height: 1.1em; }
.prose h2 { margin-top: 4px; } .prose h3 { margin-top: 12px; } .prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; max-width: 68ch; }
.prose a { color: var(--accent); }
.notice ul { margin: 6px 0 0; padding-left: 1.2em; }
/* Impresión */
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.sheet-h { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.fillin { display: flex; flex-direction: column; gap: 8px; font-size: 0.9rem; min-width: 240px; }
.fillin i { display: inline-block; width: 200px; border-bottom: 1px solid var(--ink); }
.pq { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 12px; font-family: var(--f-display); }
.pq > li { break-inside: avoid; }
.pq p { margin: 0 0 4px; max-width: none; }
.po { list-style: none; margin: 0; padding-left: 0.4em; display: flex; flex-direction: column; gap: 2px; font-family: var(--f-ui); font-size: 0.93rem; }
table.answers { border-collapse: collapse; font-size: 0.9rem; }
table.answers th, table.answers td { border: 1px solid var(--line); padding: 4px 10px; text-align: center; }
table.answers.key td:last-child { text-align: left; }
.box { display: inline-block; width: 14px; height: 14px; border: 1.5px solid var(--ink); border-radius: 2px; vertical-align: middle; }
@media print {
  :root { --bg: #fff; --surface: #fff; --ink: #000; --line: #999; --muted: #444; }
  body { background: #fff; font-size: 11pt; }
  header.bar, footer, .no-print, body::before { display: none !important; }
  main { padding: 0 !important; }
  .sheet { border: 0; padding: 0; break-after: page; }
  .print-root { gap: 0 !important; }
}
@media (max-width: 560px) {
  nav.main { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
  .bars .r { grid-template-columns: 5.6rem 1fr 3rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>
<header class="bar">
  <div class="wrap">
    <button class="mark" id="home-link" type="button">QUAESTIA<small id="tagline">Bioquímica metabólica</small></button>
    <nav class="main" id="nav" aria-label="Secciones"></nav>
    <div class="lang" role="group" aria-label="Idioma">
      <button type="button" id="lang-es" data-lang="es">ES</button>
      <button type="button" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</header>
<main class="wrap" id="main"><p class="muted">Cargando el banco de preguntas…</p></main>
<footer><div class="wrap" id="foot"></div></footer>

<script src="firebase-config.js"></script>
<script>
"use strict";
/* ============================================================
   QUAESTIA — autoevaluación de Bioquímica metabólica (BIOCOGNIA)
   Versión 0.1 (estudiante). Sin servidor: datos en el navegador.
   ============================================================ */
const APP_VERSION = "0.3.1";
const TEMAS = [1, 2, 3, 4, 5, 6, 7];

/* ---------- Núcleo (equivale a metahub-core.js) ---------- */
const CONFIG = {
  maxMarcadas: 3,
  penalizacionError: 0.2,
  notaSobre: 10,
  notaMinimaCero: true,
  examen: { 1: 5, 2: 10, 3: 10, 4: 5, 5: 6, 6: 7, 7: 7 },
  entrenamientoTamanos: [10, 15, 20],
  // Semana de uso: se cuenta desde el primer uso de cada persona (cada cual empieza cuando quiere).
  // Si se fija una fecha (AAAA-MM-DD), se cuenta desde ella para todos.
  inicioCurso: null,
};
function puntuarPregunta(correctas, marcadas, cfg = CONFIG) {
  const marc = [...new Set(marcadas)];
  if (marc.length > cfg.maxMarcadas) throw new Error("max");
  const valor = 1 / correctas.length;
  let p = 0, aciertos = 0, errores = 0;
  for (const m of marc) {
    if (correctas.includes(m)) { p += valor; aciertos++; } else { p -= cfg.penalizacionError; errores++; }
  }
  return { puntos: p, aciertos, errores, enBlanco: marc.length === 0 };
}
function corregirPrueba(respuestas, cfg = CONFIG) {
  const detalle = respuestas.map(({ pregunta, marcadas, tiempo_s }) => ({
    id: pregunta.id, tema: pregunta.tema, seccion: pregunta.seccion, bloom: pregunta.bloom,
    correctas: pregunta.correctas.slice(), marcadas: [...new Set(marcadas)].sort(), tiempo_s: tiempo_s || 0,
    ...puntuarPregunta(pregunta.correctas, marcadas, cfg),
  }));
  const bruto = detalle.reduce((s, d) => s + d.puntos, 0);
  const max = respuestas.length;
  let nota = max ? (bruto / max) * cfg.notaSobre : 0;
  if (cfg.notaMinimaCero) nota = Math.max(0, nota);
  return { bruto, max, nota: Math.round(nota * 100) / 100, detalle };
}
function muestra(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function generarSimulacro(banco) {
  const test = banco.filter((q) => q.tipo === "test");
  const out = [];
  for (const [tema, n] of Object.entries(CONFIG.examen)) out.push(...muestra(test.filter((q) => String(q.tema) === tema), n));
  return out;
}
function generarEntrenamiento(banco, { temas, n, secciones, blooms }) {
  let pool = banco.filter((q) => q.tipo === "test" && temas.includes(q.tema));
  if (secciones.length) pool = pool.filter((q) => secciones.includes(q.seccion));
  if (blooms.length) pool = pool.filter((q) => blooms.includes(q.bloom));
  return { preguntas: muestra(pool, Math.min(n, pool.length)), disponibles: pool.length };
}

const S = { lang: "es", banco: [], meta: {}, view: "home", run: null, result: null, short: null };
const KEY = "quaestia.v1";
// Capa de almacenamiento: hoy el navegador; mañana se puede cambiar por un servidor sin tocar el resto.
const Store = {
  _read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
  _write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } },
  get(k, def) { const d = this._read(); return k in d ? d[k] : def; },
  set(k, v) { const d = this._read(); d[k] = v; this._write(d); },
  clear() { try { localStorage.removeItem(KEY); } catch (e) {} },
};
const T = (k, ...a) => { const v = I18N[S.lang][k]; return typeof v === "function" ? v(...a) : v; };
const tx = (o) => (o && (o[S.lang] || o.es)) || "";
function fmt(n, d = 2) { const r = Math.round(n * 100) / 100; const s = (Number.isInteger(r) ? String(r) : r.toFixed(d).replace(/0+$/, "").replace(/\.$/, "")); return S.lang === "es" ? s.replace(".", ",") : s; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
// Texto del banco: admite solo <sub>, <sup> e <i>; todo lo demás se escapa.
function rich(s) { return String(s || "").replace(/<(?!\/?(?:sub|sup|i)>)/g, "&lt;"); }
const $ = (sel, root = document) => root.querySelector(sel);
const main = () => $("#main");
function bl(b) { return `<span class="bl" data-b="${b}"><span>${b}</span> ${esc(I18N[S.lang].bl_names[b])}</span>`; }
function hm(sec) { const m = Math.floor(sec / 60), s = Math.round(sec % 60); return `${m}:${String(s).padStart(2, "0")}`; }
function uid(n = 10) { const a = new Uint8Array(n); (crypto || window.crypto).getRandomValues(a); return Array.from(a, (x) => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[x % 32]).join(""); }
function semanaCurso(fecha = new Date()) {
  let ini = CONFIG.inicioCurso ? new Date(CONFIG.inicioCurso) : null;
  if (!ini) { const f = Store.get("primerUso", null); ini = f ? new Date(f) : fecha; }
  return Math.max(1, Math.floor((fecha - ini) / (7 * 864e5)) + 1);
}

/* ---------- Carga del banco ---------- */
async function cargar() {
  const datos = await Promise.all(TEMAS.map((t) => fetch(`data/tema0${t}.json`).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })));
  for (const d of datos) {
    S.meta[d.tema] = { titulo: d.titulo, secciones: d.secciones || {}, conceptos: d.conceptos_clave || {} };
    for (const q of d.preguntas) S.banco.push(q);
  }
}

/* ---------- Ejecución de una prueba ---------- */
function startRun(modo, preguntas, cfg) {
  if (!Store.get("primerUso", null)) Store.set("primerUso", new Date().toISOString());
  S.run = { modo, cfg, preguntas, idx: 0, marcadas: preguntas.map(() => []), checked: preguntas.map(() => false), t: preguntas.map(() => 0), inicio: Date.now(), tq: Date.now(), done: false, msg: "", confirm: null };
  S.view = "run"; render(); window.scrollTo(0, 0);
}
function tick() { const r = S.run; if (!r) return; const now = Date.now(); r.t[r.idx] += (now - r.tq) / 1000; r.tq = now; }
function vRun() {
  const r = S.run, q = r.preguntas[r.idx], n = r.preguntas.length, marc = r.marcadas[r.idx], checked = r.checked[r.idx];
  const train = r.modo === "train";
  const opts = Object.entries(q.opciones).map(([k, v]) => {
    let cls = "", tag = "";
    if (checked) {
      const ok = q.correctas.includes(k), m = marc.includes(k);
      if (m && ok) { cls = "is-correct"; tag = T("q_marked_ok"); } else if (m) { cls = "is-wrong"; tag = T("q_marked_bad"); } else if (ok) { cls = "is-correct"; tag = T("q_missed"); }
    }
    return `<button type="button" class="opt ${cls}" data-opt="${k}" aria-pressed="${marc.includes(k)}" ${checked ? "disabled" : ""}><span class="letter">${k}</span><span>${rich(tx(v))}</span><span class="tag">${tag}</span></button>`;
  }).join("");
  let feedback = "";
  if (checked) {
    const p = puntuarPregunta(q.correctas, marc).puntos;
    feedback = `<div class="explain stack"><p><b class="${p > 0 ? "pts pos" : p < 0 ? "pts neg" : "pts zero"}">${T("q_points", p)}</b></p><p class="small"><span class="eyebrow">${T("q_why")}</span><br>${rich(tx(q.justificacion))}</p></div>`;
  }
  const grid = !train ? `<div class="grid50" aria-label="Preguntas">${r.preguntas.map((_, i) => `<button type="button" data-jump="${i}" class="${r.marcadas[i].length ? "done" : ""} ${i === r.idx ? "here" : ""}" aria-label="${T("q_of", i + 1, n)}">${i + 1}</button>`).join("")}</div>` : "";
  const draft = S.lang === "en" && q.traduccion !== "done" ? `<span class="sub-badge">${T("en_draft")}</span>` : "";
  let nav;
  if (train) {
    nav = !checked ? `<div class="navrow"><button class="btn ghost" type="button" id="quit">${T("q_quit")}</button><button class="btn primary" type="button" id="check">${T("q_check")}</button></div>`
      : `<div class="navrow"><button class="btn ghost" type="button" id="quit">${T("q_quit")}</button><button class="btn primary" type="button" id="next">${r.idx === n - 1 ? T("q_finish") : T("q_next")}</button></div>`;
  } else {
    nav = `<div class="navrow"><div class="row"><button class="btn" type="button" id="prev" ${r.idx === 0 ? "disabled" : ""}>${T("q_prev")}</button><button class="btn" type="button" id="next" ${r.idx === n - 1 ? "disabled" : ""}>${T("q_next")}</button></div>
      <div class="row"><button class="btn ghost" type="button" id="quit">${T("q_quit")}</button><button class="btn primary" type="button" id="hand">${T("q_hand")}</button></div></div>`;
  }
  const conf = r.confirm ? `<div class="confirm" role="alert"><span>${r.confirm.text}</span><button class="btn primary" type="button" id="conf-yes">${r.confirm.yes}</button><button class="btn" type="button" id="conf-no">${r.confirm.no}</button></div>` : "";
  return `<div class="stack">
    <div class="qhead"><span class="eyebrow">${modeLabel(r.modo)} · ${T("q_of", r.idx + 1, n)}</span><span class="row small muted"><span class="num">${q.num}</span>${bl(q.bloom)}${byLine(q)}${draft}<span class="num" id="clock" aria-label="${T("q_elapsed")}"></span></span></div>
    <div class="progress"><span style="width:${(100 * (r.idx + (checked ? 1 : 0))) / n}%"></span></div>
    ${conf}
    <p class="stem">${rich(tx(q.enunciado))}</p>
    <div class="opts" role="group" aria-label="Opciones">${opts}</div>
    <p class="hint" aria-live="polite">${r.msg || (!checked && train ? `<span class="muted">${T("q_blank_note")}</span>` : "")}</p>
    ${feedback}${nav}${grid}</div>`;
}
let clockTimer = null;
function runAfter() {
  clearInterval(clockTimer);
  const upd = () => { const c = $("#clock"); if (c && S.run) c.textContent = hm((Date.now() - S.run.inicio) / 1000); };
  upd(); clockTimer = setInterval(upd, 1000);
}
function toggleOpt(k) {
  const r = S.run; if (r.checked[r.idx]) return;
  const m = r.marcadas[r.idx];
  if (m.includes(k)) { r.marcadas[r.idx] = m.filter((x) => x !== k); r.msg = ""; }
  else if (m.length >= CONFIG.maxMarcadas) { r.msg = T("q_max"); }
  else { m.push(k); r.msg = ""; }
  render();
}
function move(i) { tick(); S.run.idx = i; S.run.msg = ""; S.run.confirm = null; render(); window.scrollTo(0, 0); }
function askQuit() {
  S.run.confirm = { text: T("q_quit_confirm"), yes: T("q_quit_yes"), no: T("q_hand_no"), act: () => { S.run = null; clearInterval(clockTimer); S.view = S.pendingNav || "home"; S.pendingNav = null; render(); } };
  if (S.view !== "run") S.view = "run";
  render(); window.scrollTo(0, 0);
}
function finishRun() {
  tick(); clearInterval(clockTimer);
  const r = S.run; r.done = true;
  const res = corregirPrueba(r.preguntas.map((p, i) => ({ pregunta: p, marcadas: r.marcadas[i], tiempo_s: Math.round(r.t[i]) })));
  const hist = Store.get("historial", []);
  const consent = Store.get("consent", null) === true && !!Store.get("grupo", null);
  const rec = { id: uid(12), modo: r.modo === "train" ? "entrenamiento" : r.modo === "test" ? "test" : "simulacro", fecha: new Date().toISOString(), semana_curso: semanaCurso(), n_intento: hist.length + 1, investigacion: consent, grupo: Store.get("grupo", null),
    config: r.modo !== "exam" ? r.cfg : null, duracion_s: Math.round((Date.now() - r.inicio) / 1000), nota: res.nota, bruto: Math.round(res.bruto * 1000) / 1000, max: res.max, lang: S.lang, detalle: res.detalle };
  hist.push(rec); Store.set("historial", hist);
  if (consent) srvAttempt(rec);
  S.result = { rec, preguntas: r.preguntas, modo: r.modo, cfg: r.cfg };
  S.run = null; S.view = "result"; render(); window.scrollTo(0, 0);
}

/* ---------- Resultados ---------- */
function barsBy(detalle, keyFn, labelFn, colorFn) {
  const g = new Map();
  for (const d of detalle) { const k = keyFn(d); const a = g.get(k) || { p: 0, n: 0 }; a.p += d.puntos; a.n += 1; g.set(k, a); }
  return [...g.entries()].sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, { numeric: true })).map(([k, a]) => {
    const pct = Math.max(0, (100 * a.p) / a.n);
    return `<div class="r"><span>${labelFn(k)}</span><span class="track"><span style="width:${pct}%;background:${colorFn(k)}"></span></span><span class="v">${Math.round(pct)}%<span class="muted"> ·${a.n}</span></span></div>`;
  }).join("");
}
function vResult() {
  const { rec, preguntas, modo } = S.result, d = rec.detalle;
  const full = d.filter((x) => x.aciertos === x.correctas.length && x.errores === 0).length;
  const blank = d.filter((x) => x.enBlanco).length, wrong = d.reduce((s, x) => s + x.errores, 0);
  const byId = Object.fromEntries(preguntas.map((p) => [p.id, p]));
  const review = d.map((x, i) => {
    const q = byId[x.id];
    const cls = x.puntos > 0.0001 ? "pos" : x.puntos < -0.0001 ? "neg" : "zero";
    const items = Object.entries(q.opciones).map(([k, v]) => {
      const ok = q.correctas.includes(k), m = x.marcadas.includes(k);
      const c = ok ? "c" : m ? "w" : "";
      const t = m && ok ? T("q_marked_ok") : m ? T("q_marked_bad") : ok ? T("q_missed") : "";
      return `<li class="${c}"><b class="num">${k})</b> ${rich(tx(v))}${t ? ` <span class="small muted">— ${t}</span>` : ""}</li>`;
    }).join("");
    return `<details><summary><span class="num muted">${i + 1}.</span><span class="num">${q.num}</span>${bl(q.bloom)}${byLine(q)}<span class="pts ${cls}">${x.puntos > 0 ? "+" : ""}${fmt(x.puntos)}</span></summary>
      <div class="body"><p class="stem" style="font-size:1rem">${rich(tx(q.enunciado))}</p><ol>${items}</ol><p class="small"><span class="eyebrow">${T("q_why")}</span><br>${rich(tx(q.justificacion))}</p></div></details>`;
  }).join("");
  return `<div class="stack-lg">
    <div class="stack"><p class="eyebrow">${modo === "train" ? T("r_title_train") : modo === "test" ? T("r_title_test") : T("r_title_exam")}</p>
    <div class="score"><div class="big num" aria-label="${T("r_grade")}">${fmt(rec.nota)}<small> / 10</small></div>
      <div class="kv"><div><b>${fmt(rec.bruto)} / ${rec.max}</b><span>${T("r_raw")}</span></div><div><b>${full}</b><span>${T("r_right")}</span></div><div><b>${blank}</b><span>${T("r_blank")}</span></div><div><b>${wrong}</b><span>${T("r_wrongmarks")}</span></div><div><b>${hm(rec.duracion_s)}</b><span>${T("r_time")}</span></div></div></div>
    <p class="small muted">${T("r_saved")}</p></div>
    <div class="row"><button class="btn primary" type="button" id="again">${T("r_again")}</button><button class="btn" type="button" data-go="home">${T("r_home")}</button></div>
    <section class="stack"><h2>${T("r_by_bloom")}</h2><div class="bars">${barsBy(d, (x) => x.bloom, (b) => `${b} ${esc(I18N[S.lang].bl_names[b])}`, (b) => `var(--${b.toLowerCase()})`)}</div>
      <h2 style="margin-top:12px">${T("r_by_topic")}</h2><div class="bars">${barsBy(d, (x) => x.tema, (t) => `${T("col_topic")} ${t}`, () => "var(--accent)")}</div><p class="small muted">${T("r_bar_note")}</p></section>
    <section class="stack"><h2>${T("r_review")}</h2><div class="review">${review}</div></section></div>`;
}

}

/* ---------- Exportación para investigación ---------- */
function exportData() {
  const hist = Store.get("historial", []).filter((h) => h.investigacion);
  const cortas = Object.entries(Store.get("cortas", {})).flatMap(([id, c]) => (c.registros || []).filter((r) => r.investigacion).map((r) => ({ id, autoeval: r.autoeval, fecha: r.fecha, semana_curso: r.semana_curso, longitud: r.longitud })));
  return {
    schema: "quaestia-export/1", app_version: APP_VERSION, codigo: uid(8), grupo: Store.get("grupo", null), exportado: new Date().toISOString(), semana_exportacion: semanaCurso(),
    consentimiento: { fecha: Store.get("consentFecha", null) },
    intentos: hist.map((h, i) => ({ n_intento: i + 1, modo: h.modo, fecha: h.fecha, semana_curso: h.semana_curso, duracion_s: h.duracion_s, nota: h.nota, bruto: h.bruto, max: h.max, lang: h.lang, config: h.config,
      items: h.detalle.map((d) => ({ id: d.id, tema: d.tema, seccion: d.seccion, bloom: d.bloom, correctas: d.correctas, marcadas: d.marcadas, puntos: Math.round(d.puntos * 1000) / 1000, aciertos: d.aciertos, errores: d.errores, en_blanco: d.enBlanco, tiempo_s: d.tiempo_s })) })),
    cortas,
  };
}
function toCSV(x) {
  const head = ["codigo", "grupo", "n_intento", "modo", "fecha", "semana_curso", "item_id", "tema", "seccion", "bloom", "n_correctas", "correctas", "marcadas", "aciertos", "errores", "en_blanco", "puntos", "tiempo_s"];
  const rows = [head.join(",")];
  for (const a of x.intentos) for (const d of a.items) rows.push([x.codigo, x.grupo || "", a.n_intento, a.modo, a.fecha, a.semana_curso, d.id, d.tema, d.seccion || "", d.bloom, d.correctas.length, d.correctas.join(""), d.marcadas.join(""), d.aciertos, d.errores, d.en_blanco ? 1 : 0, d.puntos, d.tiempo_s].join(","));
  return rows.join("\n");
}
function download(name, text, type) {
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) {}
  const out = $("#x-out"); if (out) { out.hidden = false; out.value = text; }
}
function doExport(kind) {
  const x = exportData(), msg = $("#x-msg");
  if (!x.intentos.length && !x.cortas.length) { msg.textContent = T("x_none"); return; }
  const base = `quaestia_${x.codigo}`;
  if (kind === "json") download(`${base}.json`, JSON.stringify(x, null, 2), "application/json");
  else if (kind === "csv") download(`${base}.csv`, toCSV(x), "text/csv");
  else {
    const text = JSON.stringify(x, null, 2), out = $("#x-out"); out.hidden = false; out.value = text;
    navigator.clipboard.writeText(text).then(() => (msg.textContent = T("x_copied")), () => { msg.textContent = T("x_copy_fail"); out.select(); });
  }
}

/* ---------- Eventos ---------- */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.lang) { S.lang = t.dataset.lang; Store.set("lang", S.lang); return render(); }
  if (t.id === "home-link") return go("home");
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.consent) return setConsent(t.dataset.consent === "1");
  if (teachClick(t)) return;
  if (srvClick(t)) return;
  if (t.dataset.all) { for (const i of document.querySelectorAll('input[name="tema"]')) i.checked = t.dataset.all === "1"; return trainUpdate(); }
  if (t.id === "exam-go") return startRun("exam", generarSimulacro(S.banco), null);
  if (S.view === "run" && S.run) {
    const r = S.run;
    if (t.id === "conf-yes") return r.confirm.act();
    if (t.id === "conf-no") { r.confirm = null; S.pendingNav = null; return render(); }
    if (t.dataset.opt) return toggleOpt(t.dataset.opt);
    if (t.dataset.jump) return move(+t.dataset.jump);
    if (t.id === "prev") return move(r.idx - 1);
    if (t.id === "check") { tick(); r.checked[r.idx] = true; r.msg = ""; return render(); }
    if (t.id === "next") return r.modo === "train" && r.idx === r.preguntas.length - 1 ? finishRun() : move(r.idx + 1);
    if (t.id === "quit") return askQuit();
    if (t.id === "hand") { const left = r.marcadas.filter((m) => !m.length).length; r.confirm = { text: T("q_hand_confirm", left), yes: T("q_hand_yes"), no: T("q_hand_no"), act: finishRun }; return render(); }
  }
  if (t.id === "again") {
    const { modo, cfg } = S.result;
    if (modo === "exam") return startRun("exam", generarSimulacro(S.banco), null);
    if (modo === "test") return startRun("test", S.result.preguntas, cfg);
    return startRun("train", generarEntrenamiento(S.banco, cfg).preguntas, cfg);
  }
  if (t.id === "short-show") { const v = $("#short-ans").value; const all = Store.get("cortas", {}); const q = S.banco.filter((x) => x.tipo === "corta" && x.tema === S.short.tema)[S.short.idx]; all[q.id] = { ...(all[q.id] || {}), borrador: v }; Store.set("cortas", all); S.short.shown = true; return render(); }
  if (t.dataset.rate) return shortRate(t.dataset.rate);
  if (t.id === "short-next") { S.short.idx++; S.short.shown = false; S.short.rated = null; render(); return window.scrollTo(0, 0); }
  if (t.id === "short-restart") { S.short.idx = 0; S.short.shown = false; S.short.rated = null; return render(); }
  if (t.id === "x-json") return doExport("json");
  if (t.id === "x-csv") return doExport("csv");
  if (t.id === "x-copy") return doExport("copy");
  if (t.id === "del") { S.delConfirm = true; S.delMsg = ""; return render(); }
  if (t.id === "del-no") { S.delConfirm = false; return render(); }
  if (t.id === "del-yes") { const lang = S.lang; Store.clear(); Store.set("lang", lang); S.delConfirm = false; S.delMsg = T("me_deleted"); return render(); }
});
document.addEventListener("input", (e) => { teachInput(e); });
document.addEventListener("change", (e) => {
  if (teachChange(e)) return;
  if (e.target.id === "c-age") { const y = $("#c-yes"); if (y) y.disabled = !e.target.checked; return; }
  if (e.target.closest("#train-form")) return trainUpdate(e.target.name === "tema");
  if (e.target.id === "short-tema") { S.short = { tema: +e.target.value, idx: 0, shown: false, rated: null }; Store.set("shortTema", S.short.tema); return render(); }
});
document.addEventListener("submit", (e) => {
  if (teachSubmit(e)) return;
  if (e.target.id !== "train-form") return;
  e.preventDefault();
  const c = trainRead(); if (!c.temas.length) return;
  const { preguntas } = generarEntrenamiento(S.banco, c);
  if (preguntas.length) startRun("train", preguntas, c);
});
document.addEventListener("keydown", (e) => {
  if (S.view !== "run" || !S.run || e.target.matches("input, textarea, select")) return;
  const k = e.key.toLowerCase();
  if ("abcde".includes(k) && k.length === 1 && S.run.preguntas[S.run.idx].opciones[k]) { e.preventDefault(); toggleOpt(k); }
});

/* ---------- Arranque ---------- */
async function boot() {
  // Grupo opcional desde el enlace (?grupo=BQ2627): permite al profesorado identificar a su curso sin datos personales.
  try { const g = new URLSearchParams(location.search).get("grupo"); if (g && /^[A-Za-z0-9_-]{1,24}$/.test(g)) Store.set("grupo", g); } catch (e) {}
  S.lang = Store.get("lang", (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
  renderChrome();
  main().innerHTML = `<p class="muted">${T("loading")}</p>`;
  S.testLink = parseTestParam();
  try { await cargar(); if (S.testLink) S.view = "testIntro"; render(); srvFlush(); }
  catch (err) { main().innerHTML = `<div class="notice">${T("load_error")}</div>`; }
}
// Arranca cuando están cargados todos los scripts de la página (incluido el del profesorado).
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else setTimeout(boot);
</script>

/* ---------- Guía «Cómo contribuir» ---------- */
const GUIA = {
  es: `<h2>Cómo contribuir</h2>
<p>QUAESTIA crece con las preguntas del profesorado. Cualquier docente o profesional de la Bioquímica puede proponer preguntas; cada una se revisa antes de publicarse y, si se aprueba, aparece con el nombre de quien la propuso.</p>
<h3>Qué preguntas buscamos</h3>
<ul><li>Sobre los contenidos de los siete temas de la Guía de Bioquímica Metabólica.</li><li>De cualquier nivel de Bloom, especialmente de analizar, evaluar y crear (B4–B6), que son las más escasas.</li><li>Originales: no copiadas de libros, exámenes publicados ni otros bancos.</li></ul>
<h3>Requisitos de una pregunta tipo test</h3>
<ul><li>Enunciado claro, sin ambigüedades ni dobles negaciones.</li><li>Cinco opciones (a–e) y entre una y tres correctas.</li><li>Distractores plausibles, basados en errores habituales del alumnado.</li><li>Sin «todas las anteriores» ni «ninguna de las anteriores», y sin pistas gramaticales o de longitud.</li><li>Notación correcta: subíndices y superíndices con &lt;sub&gt; y &lt;sup&gt;, nombres en cursiva con &lt;i&gt;.</li><li>Justificación del nivel de Bloom: por qué la pregunta es de ese nivel, no cuál es la respuesta.</li></ul>
<h3>Requisitos de una pregunta de respuesta corta</h3>
<ul><li>Pregunta que se pueda responder en pocas líneas.</li><li>Respuesta modelo concisa, con los elementos que debe contener una respuesta completa.</li></ul>
<h3>Proceso</h3>
<ol><li><b>Envío.</b> Desde «Proponer una pregunta», por GitHub o por correo.</li><li><b>Revisión.</b> El coordinador comprueba la corrección científica, la claridad, el nivel de Bloom y el formato.</li><li><b>Respuesta.</b> La propuesta se acepta, se acepta con cambios (que se te consultan) o no se acepta, siempre con el motivo.</li><li><b>Publicación.</b> Las preguntas aceptadas se traducen y se incorporan en la siguiente versión del banco.</li><li><b>Reconocimiento.</b> Cada pregunta muestra «Propuesta por» con tu nombre, y apareces en la página de colaboradores.</li></ol>
<h3>Derechos</h3>

<ul><li>Questions on the seven topics of the Metabolic Biochemistry Guide.</li><li>Any Bloom level, especially analyze, evaluate and create (B4–B6), which are the scarcest.</li><li>Original questions: not copied from textbooks, published exams or other banks.</li></ul>
<h3>Requirements for a multiple-choice question</h3>
<ul><li>A clear stem, without ambiguity or double negatives.</li><li>Five options (a–e), with one to three correct.</li><li>Plausible distractors, based on common student errors.</li><li>No “all of the above” or “none of the above”, and no grammatical or length cues.</li><li>Correct notation: subscripts and superscripts with &lt;sub&gt; and &lt;sup&gt;, italic names with &lt;i&gt;.</li><li>A rationale for the Bloom level: why the question belongs to that level, not what the answer is.</li></ul>
<h3>Requirements for a short-answer question</h3>
<ul><li>A question that can be answered in a few lines.</li><li>A concise model answer listing what a complete answer must contain.</li></ul>
<h3>Process</h3>
<ol><li><b>Submission.</b> From “Propose a question”, via GitHub or email.</li><li><b>Review.</b> The coordinator checks scientific accuracy, clarity, Bloom level and formatting.</li><li><b>Decision.</b> The proposal is accepted, accepted with changes (agreed with you) or not accepted, always with the reason.</li><li><b>Publication.</b> Accepted questions are translated and added in the next version of the bank.</li><li><b>Credit.</b> Each question shows “Proposed by” with your name, and you are listed on the contributors page.</li></ol>
<h3>Rights</h3>
<p>By proposing a question you declare that it is original or that you have the right to contribute it, and you agree to its publication under the project's open license, stated in the repository.</p>
<h3>Contact</h3>
<p>Coordination: ${CONFIG.coordinador} (<a href="mailto:${CONFIG.contacto}">${CONFIG.contacto}</a>). Repository: <a href="https://github.com/${CONFIG.repo}" target="_blank" rel="noopener">github.com/${CONFIG.repo}</a>.</p>`,
};

/* ---------- Utilidades ---------- */
function rngSeed(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function shuffled(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function b64e(str) { const bytes = new TextEncoder().encode(str); let bin = ""; for (const b of bytes) bin += String.fromCharCode(b); return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64d(s) { s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))); }
function plain(s) { return String(s || "").replace(/<[^>]+>/g, ""); }
function tagsOk(s) {
  if (/<(?!\/?(?:sub|sup|i)>)/.test(s)) return false;
  const st = [];
  for (const m of s.matchAll(/<(\/?)(sub|sup|i)>/g)) { if (m[1]) { if (st.pop() !== m[2]) return false; } else st.push(m[2]); }
  return !st.length;
}
function copyText(text, msgEl, outEl) {
  if (outEl) { outEl.hidden = false; outEl.value = text; }
  const ok = () => { if (msgEl) msgEl.textContent = T("tb_copied"); };
  const ko = () => { if (msgEl) msgEl.textContent = T("tb_copy_fail"); if (outEl) outEl.select(); };
  try { navigator.clipboard.writeText(text).then(ok, ko); } catch (e) { ko(); }
}
function saveFile(name, text, type, outEl) {
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) {}
  if (outEl) { outEl.hidden = false; outEl.value = text; }
}
const byNum = () => { if (!S._byNum) S._byNum = Object.fromEntries(S.banco.map((q) => [q.num, q])); return S._byNum; };
function modeLabel(m) { return m === "train" || m === "entrenamiento" ? T("mode_train") : m === "test" ? T("mode_test") : T("mode_exam"); }
function byLine(q) { return q && q.propuesta_por && q.propuesta_por.nombre ? `<span class="small muted">· ${T("by")} ${esc(q.propuesta_por.nombre)}</span>` : ""; }

/* ---------- Moodle XML ---------- */
function cdata(s) { return `<![CDATA[${String(s).replace(/]]>/g, "]]]]><![CDATA[>")}]]>`; }
function fraction(n) { return { 1: "100", 2: "50", 3: "33.33333" }[n]; }
function moodleXML() {
  const tb = tbState(), bn = byNum(), qs = tb.sel.map((n) => bn[n]).filter(Boolean);
  const cat = `QUAESTIA/${(tb.titulo.trim() || "Test").replace(/[\/<>&]/g, " ")}`;
  const xml = [`<?xml version="1.0" encoding="UTF-8"?>`, `<quiz>`, `  <question type="category"><category><text>$course$/top/${cat}</text></category></question>`];
  for (const q of qs) {
    xml.push(`  <question type="multichoice">`, `    <name><text>${q.num}</text></name>`,
      `    <questiontext format="html"><text>${cdata(`<p>${tx(q.enunciado)}</p>`)}</text></questiontext>`,
      `    <generalfeedback format="html"><text>${cdata(`<p>${q.bloom}: ${tx(q.justificacion)}</p>`)}</text></generalfeedback>`,
      `    <defaultgrade>1.0000000</defaultgrade>`, `    <penalty>0.0000000</penalty>`, `    <hidden>0</hidden>`, `    <idnumber>${q.id}</idnumber>`,
      `    <single>false</single>`, `    <shuffleanswers>false</shuffleanswers>`, `    <answernumbering>abc</answernumbering>`,
      `    <tags><tag><text>${q.bloom}</text></tag><tag><text>tema${q.tema}</text></tag></tags>`);
    for (const [k, v] of Object.entries(q.opciones)) {
      const f = q.correctas.includes(k) ? fraction(q.correctas.length) : "-20";
      xml.push(`    <answer fraction="${f}" format="html"><text>${cdata(tx(v))}</text><feedback format="html"><text></text></feedback></answer>`);
    }
    xml.push(`  </question>`);
  }
  xml.push(`</quiz>`, "");
  return xml.join("\n");
}

    <label class="stack small">${T("pp_just")}<textarea name="pp-just" rows="2" placeholder="${T("pp_just_ph")}">${esc(p.justificacion)}</textarea></label>
    <label class="stack small">${T("pp_source")}<input class="field" name="pp-fuente" value="${esc(p.fuente)}"></label>
    <div class="grid2"><label class="stack small">${T("pp_author")}<input class="field" name="pp-nombre" value="${esc(p.nombre)}" autocomplete="name"></label><label class="stack small">${T("pp_affil")}<input class="field" name="pp-afil" value="${esc(p.afiliacion)}" autocomplete="organization"></label><label class="stack small">${T("pp_email")}<input class="field" type="email" name="pp-correo" value="${esc(p.correo)}" autocomplete="email"></label></div>
    <label class="check"><input type="checkbox" name="pp-ok1" ${p.ok1 ? "checked" : ""}><span>${T("pp_ok1")}</span></label>
    <label class="check"><input type="checkbox" name="pp-ok2" ${p.ok2 ? "checked" : ""}><span>${T("pp_ok2")}</span></label>
    <section class="stack"><p class="eyebrow">${T("pp_preview")}</p><div class="panel stack" id="pp-preview">${ppPreview()}</div></section>
    ${err}<div><button type="submit" class="btn primary">${T("pp_validate")}</button></div>${ready}
  </form>`;
}
function ppPreview() {
  const p = ppState();
  const head = `<div class="row small"><span class="num muted">${p.tema}.?.?</span>${bl(p.bloom)}${p.nombre ? `<span class="small muted">· ${T("by")} ${esc(p.nombre)}</span>` : ""}</div>`;
  const stem = `<p class="stem">${rich(p.enunciado) || "<span class='muted'>…</span>"}</p>`;
  const body = p.tipo === "test"
    ? `<div class="opts">${"abcde".split("").map((k) => `<div class="opt ${p.correctas.includes(k) ? "is-correct" : ""}"><span class="letter">${k}</span><span>${rich(p.op[k])}</span><span class="tag">${p.correctas.includes(k) ? T("q_correct") : ""}</span></div>`).join("")}</div>`
    : `<div class="answer"><p class="eyebrow">${T("s_model")}</p><p>${rich(p.respuesta)}</p></div>`;
  return head + stem + body + (p.justificacion ? `<p class="small"><span class="eyebrow">${T("q_why")}</span><br>${rich(p.justificacion)}</p>` : "");
}
function ppRead() {
  const f = $("#pp-form"); if (!f) return;
  const p = ppState(), v = (n) => (f.querySelector(`[name="${n}"]`) || {}).value;
  const tipo = (f.querySelector('input[name="pp-tipo"]:checked') || {}).value || "test";
  const tema = +v("pp-tema");
  if (tema !== p.tema || tipo !== p.tipo) { p.seccion = ""; p.concepto = ""; }
  else if (tipo === "test") p.seccion = v("pp-sec") || ""; else p.concepto = v("pp-sec") || "";
  Object.assign(p, { tipo, tema, bloom: v("pp-bloom"), idioma: v("pp-idioma"), enunciado: (v("pp-enunciado") || "").trim(), justificacion: (v("pp-just") || "").trim(), fuente: (v("pp-fuente") || "").trim(),
    nombre: (v("pp-nombre") || "").trim(), afiliacion: (v("pp-afil") || "").trim(), correo: (v("pp-correo") || "").trim(),
    ok1: f.querySelector('[name="pp-ok1"]').checked, ok2: f.querySelector('[name="pp-ok2"]').checked });
  if (tipo === "test") {
    for (const i of f.querySelectorAll('[name="pp-op"]')) p.op[i.dataset.k] = i.value.trim();
    p.correctas = [...f.querySelectorAll('[name="pp-key"]:checked')].map((i) => i.value);
  } else p.respuesta = (v("pp-respuesta") || "").trim();
  Store.set("pp", p);
}
function ppValidate() {
  const p = ppState(), e = [];
  if (!(p.tipo === "test" ? p.seccion : p.concepto)) e.push("e_sec");
  if (!p.enunciado) e.push("e_stem");
  if (p.tipo === "test") {
    if ("abcde".split("").some((k) => !p.op[k])) e.push("e_opts");
    if (p.correctas.length < 1 || p.correctas.length > 3) e.push("e_keys");
  } else if (!p.respuesta) e.push("e_answer");
  if (!p.justificacion) e.push("e_just");
  const texts = [p.enunciado, p.respuesta, p.justificacion, ...Object.values(p.op)];
  if (texts.some((s) => s && !tagsOk(s))) e.push("e_tags");
  if (!p.nombre) e.push("e_author");
  if (!p.ok1 || !p.ok2) e.push("e_ok");
  return e;
}
function ppBuild() {
  const p = ppState(), L = p.idioma, w = (s) => ({ [L]: s });
  const q = { schema: "quaestia-propuesta/1", fecha: new Date().toISOString().slice(0, 10), tema: p.tema, tipo: p.tipo, bloom: p.bloom, idioma: L, enunciado: w(p.enunciado) };
  if (p.tipo === "test") { q.seccion = p.seccion; q.opciones = Object.fromEntries("abcde".split("").map((k) => [k, w(p.op[k])])); q.correctas = p.correctas.slice().sort(); }
  else { q.concepto_clave = p.concepto; q.respuesta = w(p.respuesta); }
  q.justificacion = w(p.justificacion);
  if (p.fuente) q.fuente = p.fuente;
  q.propuesta_por = { nombre: p.nombre, ...(p.afiliacion ? { afiliacion: p.afiliacion } : {}) };
  return q;
}
function ppIssue(q) {
  const p = ppState();
  const title = `[Propuesta] Tema ${q.tema} · ${q.bloom} · ${plain(p.enunciado).slice(0, 60)}`;
  const lines = [`**Propuesta de pregunta para QUAESTIA**`, ``, `- Tema: ${q.tema} · ${q.tipo === "test" ? `Sección ${q.seccion}` : `Concepto clave ${q.concepto_clave}`}`, `- Tipo: ${q.tipo} · Nivel: ${q.bloom} · Idioma: ${q.idioma}`,
    `- Propuesta por: ${p.nombre}${p.afiliacion ? ` (${p.afiliacion})` : ""}`, ``, `**Enunciado:** ${p.enunciado}`];
  if (q.tipo === "test") { lines.push(""); for (const k of "abcde") lines.push(`${q.correctas.includes(k) ? "✔" : "·"} ${k}) ${p.op[k]}`); }
  else lines.push("", `**Respuesta modelo:** ${p.respuesta}`);
  lines.push("", `**Justificación del nivel:** ${p.justificacion}`);
  if (p.fuente) lines.push(`**Fuente:** ${p.fuente}`);
  lines.push("", "El autor ha declarado que la pregunta es original o tiene derecho a cederla, y acepta su publicación bajo la licencia abierta del proyecto.", "", "```json", JSON.stringify(q, null, 2), "```");
  return { title, body: lines.join("\n") };
}

/* ---------- Colaboradores ---------- */
function vCredits() {
  const g = new Map();
  for (const q of S.banco) if (q.propuesta_por && q.propuesta_por.nombre) {
    const k = q.propuesta_por.nombre, a = g.get(k) || { afil: q.propuesta_por.afiliacion || "", n: 0, temas: new Set() };
    a.n++; a.temas.add(q.tema); g.set(k, a);
  }
  const list = [...g.entries()].sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0]));
  return `<section class="stack"><h2>${T("cr_title")}</h2><p class="muted">${T("cr_intro")}</p>
    ${list.length ? `<div class="tablebox"><table class="temas"><tbody>${list.map(([k, a]) => `<tr><td><b>${esc(k)}</b>${a.afil ? `<br><span class="small muted">${esc(a.afil)}</span>` : ""}</td><td class="n">${T("cr_n", a.n)}</td><td class="n">${[...a.temas].sort().map((t) => `${T("col_topic")} ${t}`).join(", ")}</td></tr>`).join("")}</tbody></table></div>` : `<p class="notice">${T("cr_none")}</p>`}
    <div class="kv" style="margin-top:12px"><div><b style="font-family:var(--f-ui)">${CONFIG.coordinador}</b><span>${T("cr_coord")}</span></div><div><b style="font-family:var(--f-ui)">Guía de Bioquímica Metabólica</b><span>${T("cr_bank")}</span></div></div></section>`;
}

/* ---------- Eventos del profesorado ---------- */
function teachClick(t) {
  if (t.dataset.tsub) { S.tsub = t.dataset.tsub; S.ppErrors = null; S.ppOut = null; render(); return true; }
  if (t.id === "ti-start") {
    const bn = byNum(), qs = S.testLink.nums.map((n) => bn[n]).filter((q) => q && q.tipo === "test");
    startRun("test", qs, { titulo: S.testLink.titulo, nums: qs.map((q) => q.num) }); return true;
  }
  if (S.view === "print") {
    if (t.id === "pr-back") { S.view = "teach"; render(); window.scrollTo(0, 0); return true; }
    if (t.id === "pr-print") { try { window.print(); } catch (e) {} return true; }
  }
  if (S.view !== "teach") return false;
  const tb = tbState();
  if (t.dataset.tbAdd) { if (!tb.sel.includes(t.dataset.tbAdd)) tb.sel.push(t.dataset.tbAdd); tbSave(); render(); return true; }
  if (t.dataset.tbRm) { tb.sel.splice(+t.dataset.tbRm, 1); tbSave(); render(); return true; }
  if (t.dataset.tbUp) { const i = +t.dataset.tbUp; [tb.sel[i - 1], tb.sel[i]] = [tb.sel[i], tb.sel[i - 1]]; tbSave(); render(); return true; }
  if (t.dataset.tbDown) { const i = +t.dataset.tbDown; [tb.sel[i + 1], tb.sel[i]] = [tb.sel[i], tb.sel[i + 1]]; tbSave(); render(); return true; }
  if (t.id === "tb-more") { tb.shown += 30; render(); return true; }
  if (t.id === "tb-clear") { tb.sel = []; tbSave(); render(); return true; }
  if (t.id === "tb-random") {
    const n = Math.max(1, Math.min(100, +($("#tb-n") || {}).value || tb.n)); tb.n = n;
    const pool = tbPool().filter((q) => !tb.sel.includes(q.num));
    tb.sel.push(...muestra(pool, n).map((q) => q.num)); tbSave(); render(); return true;
  }
  if (t.id === "tb-link") { const box = $("#tb-link-out"); box.hidden = false; $("#tb-link-url").value = tbLink(); return true; }
  if (t.id === "tb-link-copy") { copyText($("#tb-link-url").value, $("#tb-link-msg")); return true; }
  if (t.id === "tb-print") { tb.modelos = +$("#tb-models").value; tbSave(); S.view = "print"; render(); window.scrollTo(0, 0); return true; }
  if (t.id === "tb-moodle") { saveFile(`quaestia_${(tb.titulo.trim() || "test").replace(/[^\w-]+/g, "_").slice(0, 40)}.xml`, moodleXML(), "application/xml", $("#tb-moodle-out")); return true; }
  if (t.id === "tb-moodle-copy") { copyText(moodleXML(), $("#tb-moodle-msg"), $("#tb-moodle-out")); return true; }
  if (t.id === "pp-gh" && S.ppOut) {
    const { title, body } = ppIssue(S.ppOut);
    const url = `https://github.com/${CONFIG.repo}/issues/new?labels=propuesta&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`;
    try { window.open(url.length < 7800 ? url : `https://github.com/${CONFIG.repo}/issues/new?labels=propuesta&title=${encodeURIComponent(title)}`, "_blank", "noopener"); } catch (e) {}
    if (url.length >= 7800) copyText(body, $("#pp-msg"), $("#pp-out"));
    return true;
  }
  if (t.id === "pp-mail" && S.ppOut) {
    const { title, body } = ppIssue(S.ppOut), p = ppState();
    const mailBody = body + (p.correo ? `\n\nCorreo de contacto: ${p.correo}` : "");
    try { location.href = `mailto:${CONFIG.contacto}?subject=${encodeURIComponent(title)}&body=${encodeURIComponent(mailBody.length < 1800 ? mailBody : mailBody.slice(0, 1700) + "\n\n[…] (pega aquí el texto completo copiado desde QUAESTIA)")}`; } catch (e) {}
    if (mailBody.length >= 1800) copyText(body, $("#pp-msg"), $("#pp-out"));
    return true;
  }
  if (t.id === "pp-copy" && S.ppOut) { copyText(ppIssue(S.ppOut).body, $("#pp-msg"), $("#pp-out")); return true; }
  if (t.id === "pp-reset") { S.pp = null; Store.set("pp", null); S.ppErrors = null; S.ppOut = null; render(); window.scrollTo(0, 0); return true; }
  return false;
}
function teachInput(e) {
  if (S.view !== "teach") return false;
  const el = e.target, tb = tbState();
  if (el.id === "tb-title") { tb.titulo = el.value; tbSave(); return true; }
  if (el.id === "tb-q") { tb.q = el.value; tb.shown = 30; tbSave(); clearTimeout(S._tbq); S._tbq = setTimeout(() => { render(); const i = $("#tb-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); return true; }
  if (el.closest && el.closest("#pp-form") && el.type !== "checkbox" && el.type !== "radio" && el.tagName !== "SELECT") {
    ppRead(); S.ppOut = null; const pv = $("#pp-preview"); if (pv) pv.innerHTML = ppPreview(); const r = $("#pp-ready"); if (r) r.remove(); return true;
  }
  return false;
}
function teachChange(e) {
  if (S.view !== "teach") return false;
  const el = e.target, tb = tbState();
  if (el.name === "tb-tema") { tb.temas = [...document.querySelectorAll('input[name="tb-tema"]:checked')].map((i) => +i.value); tb.shown = 30; tbSave(); render(); return true; }
  if (el.name === "tb-bloom") { tb.blooms = [...document.querySelectorAll('input[name="tb-bloom"]:checked')].map((i) => i.value); tb.shown = 30; tbSave(); render(); return true; }
  if (el.id === "tb-n") { tb.n = +el.value || 10; tbSave(); return true; }
  if (el.id === "tb-models") { tb.modelos = +el.value; tbSave(); return true; }
  if (el.closest && el.closest("#pp-form")) {
    ppRead(); S.ppOut = null;
    if (el.name === "pp-tipo" || el.name === "pp-tema") { render(); return true; }
    const pv = $("#pp-preview"); if (pv) pv.innerHTML = ppPreview(); const r = $("#pp-ready"); if (r) r.remove(); return true;
  }
  return false;
}
function teachSubmit(e) {
  if (e.target.id !== "pp-form") return false;
  e.preventDefault(); ppRead();
  S.ppErrors = ppValidate(); S.ppOut = S.ppErrors.length ? null : ppBuild();
  render();
  const target = S.ppErrors.length ? document.querySelector('[role="alert"]') : $("#pp-ready");
  if (target) target.scrollIntoView({ block: "center" });
  return true;
}
</script>
<script>
"use strict";
/* ============================================================
   QUAESTIA — Envío automático al servidor (Firebase, región UE).
   Apagado por defecto: se activa en firebase-config.js.
   Solo envía datos de quien participa (enlace de grupo + consentimiento).
   ============================================================ */
(function () {
  const fc = window.QUAESTIA_FIREBASE || {};
  Object.assign(CONFIG, { envio: !!(fc.envio && fc.config), firebase: fc.config || null });
})();

Object.assign(I18N.es, {
  c_text_srv: "Esta aplicación forma parte del estudio BIOCOGNIA sobre aprendizaje de la Bioquímica (Universidad de Córdoba; informe del comité de ética [referencia]). Si aceptas, tus respuestas se enviarán a un servidor en la Unión Europea con un identificador aleatorio, sin tu nombre ni tu correo. Participar o no no afecta a tu nota y el profesor no puede saber quién eres. Si no aceptas, puedes usar la aplicación igual y no se envía nada.",
  srv_on: "Tus respuestas se envían automáticamente al estudio con un identificador aleatorio.", srv_pending: (n) => `${n} envíos pendientes; se completarán cuando haya conexión.`,
  srv_del: "Borrar lo que he enviado al estudio", srv_del_confirm: "Se borrarán del servidor todas las respuestas enviadas desde este navegador. No se puede deshacer.", srv_del_yes: "Sí, borrar del servidor", srv_deleted: "Datos borrados del servidor.", srv_del_fail: "No se ha podido borrar ahora. Inténtalo de nuevo con conexión.",
});
Object.assign(I18N.en, {
  c_text_srv: "This app is part of the BIOCOGNIA study on learning biochemistry (University of Córdoba; ethics committee report [reference]). If you agree, your answers will be sent to a server in the European Union under a random identifier, without your name or email. Taking part or not does not affect your grade, and the teacher cannot know who you are. If you don't agree, you can still use the app and nothing is sent.",
  srv_on: "Your answers are sent automatically to the study under a random identifier.", srv_pending: (n) => `${n} uploads pending; they will finish when you are online.`,
  srv_del: "Delete what I have sent to the study", srv_del_confirm: "All answers sent from this browser will be deleted from the server. This cannot be undone.", srv_del_yes: "Yes, delete from server", srv_deleted: "Data deleted from the server.", srv_del_fail: "Deletion failed. Try again when you are online.",
});

const SRV = { ready: null, flushing: false };
// El grupo PRUEBA envía aunque el envío general esté apagado: sirve para comprobar el circuito sin datos de alumnos.
function srvOn() { return !!(CONFIG.firebase && (CONFIG.envio || Store.get("grupo", null) === "PRUEBA")) || !!window.QUAESTIA_SRV_MOCK; }
function srvParticipa() { return srvOn() && Store.get("consent", null) === true && !!Store.get("grupo", null); }

// Implementación por defecto: Firebase (SDK modular cargado solo si el envío está activo).
function srvImpl() {
  if (window.QUAESTIA_SRV_MOCK) return Promise.resolve(window.QUAESTIA_SRV_MOCK);
  if (SRV.ready) return SRV.ready;
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  SRV.ready = (async () => {
    const [appM, authM, fsM] = await Promise.all([import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")]);
    const app = appM.initializeApp(CONFIG.firebase);
    const auth = authM.getAuth(app), db = fsM.getFirestore(app);
    await auth.authStateReady();
    if (!auth.currentUser) await authM.signInAnonymously(auth);
    const uid = () => auth.currentUser.uid;
    return {
      async add(kind, data) { await fsM.addDoc(fsM.collection(db, kind), { ...data, uid: uid(), creado: fsM.serverTimestamp() }); },
      async deleteMine() {
        for (const c of ["intentos", "cortas"]) {
          const snap = await fsM.getDocs(fsM.query(fsM.collection(db, c), fsM.where("uid", "==", uid())));
          for (const d of snap.docs) await fsM.deleteDoc(d.ref);
        }
      },
    };
  })();
  SRV.ready.catch(() => { SRV.ready = null; });
  return SRV.ready;
}
function srvQueue(kind, data) {
  if (!srvParticipa()) return;
  const q = Store.get("pendientes", []); q.push({ kind, data }); Store.set("pendientes", q);
  srvFlush();
}
async function srvFlush() {
  if (!srvOn() || SRV.flushing) return;
  let q = Store.get("pendientes", []); if (!q.length) return;
  SRV.flushing = true;
  try {
    const impl = await srvImpl();
    while (q.length) { await impl.add(q[0].kind, q[0].data); q.shift(); Store.set("pendientes", q); }
  } catch (e) { /* se reintenta en el próximo arranque o envío */ }
  finally { SRV.flushing = false; }
}
async function srvDeleteMine() {
  Store.set("pendientes", []);
  const impl = await srvImpl();
  await impl.deleteMine();
}
function srvAttempt(rec) {
  srvQueue("intentos", {
    app: "quaestia", app_version: APP_VERSION, grupo: rec.grupo || Store.get("grupo", null), modo: rec.modo, fecha: rec.fecha, semana_curso: rec.semana_curso, n_intento: rec.n_intento,
    nota: rec.nota, bruto: rec.bruto, max: rec.max, duracion_s: rec.duracion_s, lang: rec.lang, config: rec.config || null,
    items: rec.detalle.map((d) => ({ id: d.id, tema: d.tema, seccion: d.seccion || "", bloom: d.bloom, correctas: d.correctas.join(""), marcadas: d.marcadas.join(""), aciertos: d.aciertos, errores: d.errores, en_blanco: d.enBlanco, puntos: Math.round(d.puntos * 1000) / 1000, tiempo_s: d.tiempo_s })),
  });
}
function srvShort(id, reg) {
  srvQueue("cortas", { app: "quaestia", app_version: APP_VERSION, grupo: Store.get("grupo", null), id, autoeval: reg.autoeval, fecha: reg.fecha, semana_curso: reg.semana_curso, longitud: reg.longitud });
}
function srvPanel() {
  if (!srvOn() || Store.get("consent", null) !== true || !Store.get("grupo", null)) return "";
  const pend = Store.get("pendientes", []).length;
  const del = S.srvConfirm
    ? `<div class="confirm" role="alert"><span>${T("srv_del_confirm")}</span><button class="btn primary" type="button" id="srv-del-yes">${T("srv_del_yes")}</button><button class="btn" type="button" id="srv-del-no">${T("q_hand_no")}</button></div>`
    : `<div class="row"><button class="btn ghost" type="button" id="srv-del">${T("srv_del")}</button>${S.srvMsg ? `<span class="small muted">${S.srvMsg}</span>` : ""}</div>`;
  return `<p class="small">${T("srv_on")}${pend ? ` ${T("srv_pending", pend)}` : ""}</p>${del}`;
}
function srvClick(t) {
  if (t.id === "srv-del") { S.srvConfirm = true; S.srvMsg = ""; render(); return true; }
  if (t.id === "srv-del-no") { S.srvConfirm = false; render(); return true; }
  if (t.id === "srv-del-yes") {
    S.srvConfirm = false;
    srvDeleteMine().then(() => { S.srvMsg = T("srv_deleted"); render(); }, () => { S.srvMsg = T("srv_del_fail"); render(); });
    render(); return true;
  }
  return false;
}
</script>
