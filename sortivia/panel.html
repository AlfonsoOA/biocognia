<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>SORTIVIA · Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sortivia.css">
<style>
main.wrap { max-width: 1060px; }
.code { font-family: var(--f-mono); font-size: clamp(2.2rem, 7vw, 3.4rem); letter-spacing: .18em; font-weight: 500; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.kv div { display: flex; flex-direction: column; } .kv b { font-family: var(--f-mono); font-size: 1.3rem; font-weight: 400; } .kv span { font-size: .8rem; color: var(--muted); }
details.g > summary { cursor: pointer; list-style: none; }
details.g > summary::-webkit-details-marker { display: none; }
.det { padding: 10px 0 4px; display: flex; flex-direction: column; gap: 10px; font-size: .9rem; }
.det table td, .det table th { padding: 4px 6px; }
.pos { color: var(--ok); } .neg { color: var(--bad); }
tr.regla td { background: var(--warn-bg); } tr.nocuenta td { opacity: .55; } tr.nocuenta td.n { text-decoration: line-through; }
.just { background: var(--sunk); border-radius: 8px; padding: 8px 10px; white-space: pre-wrap; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.acc { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.uid { font-family: var(--f-mono); font-size: .8rem; word-break: break-all; }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
ul.err { margin: 0; padding-left: 20px; color: var(--bad); font-size: .9rem; }
.plan td, .plan th { font-size: .85rem; padding: 4px 6px; }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="mark" href="./">SORTIVIA<small>Panel del profesorado</small></a>
  <span class="small muted spacer" id="who"></span>
</div></header>
<main class="wrap stack-lg" id="main">
  <section class="panel stack" id="login">
    <p>Panel del profesorado: crea sesiones, sigue a los grupos en directo, haz de árbitro (puntos y sorteos) y convierte tus hojas de claves en actividades. Hace falta una cuenta autorizada por el administrador.</p>
    <div class="row"><button class="btn primary" id="signin">Entrar con Google</button><a class="btn ghost" href="proponer.html">¿Quieres proponer una actividad?</a></div>
    <p class="small" id="err" role="alert" style="color:var(--bad)"></p>
  </section>
</main>
<footer><div class="wrap" id="foot"></div></footer>
<script src="../comun/panel_i18n.js?v=1.0"></script>
<script src="../quaestia/firebase-config.js"></script>
<script src="sortivia.js?v=0.7.3"></script>
<script src="../comun/estadisticas.js?v=1.1"></script>
<script>
"use strict";
const P = { rol: null, uid: null, email: "", nombre: "", vista: "inicio", acts: [], fsActs: [], repo: [], claves: {}, sesiones: [], profs: [], conv: null,
  sid: null, ses: null, act: null, grupos: [], auto: true, busy: new Set(), open: new Set(), msg: "" };
const ESTADOS = { editando: ["Decidiendo", ""], enviado: ["Enviada", "go"], puntuado: ["Eligiendo números", "go"], sorteo_pedido: ["Sorteo pedido", "go"], ganado: ["Ganado", "ok"], fallado: ["Fallado", "bad"], terminado: ["Terminado", "bad"] };
const ESTACT = { publicada: ["Publicada", "ok"], propuesta: ["Propuesta", "go"], borrador: ["Borrador", ""] };
const fmt = (n) => svEur(n, PANEL_LANG);
const W = (es, en) => (PANEL_LANG === "en" ? en : es);
const admin = () => P.rol === "admin";
$("#foot").innerHTML = `SORTIVIA · panel · v${SV_VERSION}${SVB.demo ? ` · <span class="pill go">Modo demostración: todo se guarda en este navegador</span>` : ""}`;

/* ---------- Carga de datos ---------- */
async function cargarActividades() {
  P.repo = await svIndiceRepo();
  P.fsActs = await SVB.actividades().catch(() => []);
  const enRepo = new Set(P.repo.map((a) => a.id));
  P.acts = P.repo.map((a) => ({ id: a.id, titulo: a.titulo, asignatura: a.asignatura || "", origen: "repo", estado: "publicada" }));
  for (const a of P.fsActs) {
    if (enRepo.has(a.id)) continue;
    if (!admin() && a.estado !== "publicada" && a.autor !== P.uid) continue;
    P.acts.push({ id: a.id, titulo: (a.datos || {}).titulo || a.id, asignatura: (a.datos || {}).asignatura || "", origen: "panel", estado: a.estado, autor: a.autor, autor_nombre: a.autor_nombre || "", actualizado: a.actualizado });
  }
  P.claves = {};
  await Promise.all(P.acts.map(async (a) => { P.claves[a.id] = await SVB.clave(a.id).catch(() => null); }));
}
async function cargarSesiones() { P.sesiones = await SVB.sesiones(admin()).catch(() => []); }
async function cargarProfes() { P.profs = admin() ? await SVB.profesores().catch(() => []) : []; }
const nombreProf = (uid) => uid === P.uid ? "Tú" : ((P.profs.find((p) => p.uid === uid) || {}).nombre || (uid ? uid.slice(0, 8) + "…" : "—"));

/* ---------- Árbitro ---------- */
async function arbitrar() {
  if (!P.auto || !P.act) return;
  for (const g of P.grupos) {
    const k = g.id + ":" + g.estado + ":" + g.ronda;
    if (P.busy.has(k)) continue;
    try { await arbitrarGrupo(g, k); }
    catch (er) { P.busy.delete(k); P.msg = `No se ha podido procesar el grupo «${g.nombre}»: ${er.code || er.message}. Se reintentará.`; render(); setTimeout(arbitrar, 4000); }
  }
}
async function arbitrarGrupo(g, k) {
  const clave = P.claves[P.act.id];
  {
    if (g.estado === "enviado") {
      if (!clave) { P.busy.delete(k); return; }
      P.busy.add(k);
      const el = g.eleccion || svEleccionVacia(P.act), c = svCosteTotal(P.act, el), falta = svPendientes(P.act, el);
      if (!svCabe(P.act, el) || falta.length) {
        await SVB.cambiarGrupoAdmin(P.sid, g.id, { estado: "editando", aviso: !svCabe(P.act, el) ? "La estrategia supera el presupuesto o el tiempo disponible." : "Faltan decisiones por tomar." });
        return;
      }
      const { total, detalle } = svPuntos(P.act, clave, el), pts = svEscalar(clave, total), n = svNumeros(P.act, pts);
      const h = (g.historial || []).concat([{ ronda: g.ronda, coste: c, puntos: pts, puntos_brutos: total, numeros: n, detalle, eleccion: el, justif: g.justif || {}, fecha: new Date().toISOString() }]);
      await SVB.cambiarGrupoAdmin(P.sid, g.id, { estado: "puntuado", puntos: pts, numeros: n, sorteo: null, aviso: null, historial: h });
    } else if (g.estado === "sorteo_pedido") {
      P.busy.add(k);
      const n = Math.min(g.numeros || 0, P.act.numeros), el = [...new Set((g.elegidos || []).map(Number))].filter((x) => x >= 1 && x <= P.act.numeros);
      if (el.length !== n) { await SVB.cambiarGrupoAdmin(P.sid, g.id, { estado: "puntuado", aviso: `Hay que elegir exactamente ${n} números.` }); return; }
      const x = svAleatorio(P.act.numeros), gana = el.includes(x);
      const h = (g.historial || []).slice(); if (h.length) Object.assign(h[h.length - 1], { elegidos: el, sorteo: x, resultado: gana ? "ganado" : "fallado" });
      await SVB.cambiarGrupoAdmin(P.sid, g.id, { sorteo: x, estado: gana ? "ganado" : (g.ronda >= P.act.rondas ? "terminado" : "fallado"), historial: h, aviso: null });
    }
  }
}


/* ---------- Vistas: inicio ---------- */
function vTabs() {
  const t = [["inicio", "Sesiones y actividades"], ["conversor", "Crear actividad desde Excel"]];
  if (admin()) t.push(["profesorado", "Profesorado"], ["estadisticas", "Estadísticas de uso"]);
  return `<nav class="tabs" aria-label="Secciones">${t.map(([v, l]) => `<button class="btn small" data-vista="${v}" aria-pressed="${P.vista === v}">${l}</button>`).join("")}</nav>`;
}
// Actividades agrupadas por asignatura (las que no tienen, al final) y por título dentro de cada una.
function porAsignatura(lista) {
  const g = new Map();
  for (const a of lista.slice().sort((x, y) => svT(x.titulo, PANEL_LANG).localeCompare(svT(y.titulo, PANEL_LANG), "es"))) { const k = a.asignatura || ""; if (!g.has(k)) g.set(k, []); g.get(k).push(a); }
  return [...g.entries()].sort(([a], [b]) => (a === "") - (b === "") || a.localeCompare(b, "es"));
}
const etiquetaAsig = (k) => k || "Sin asignatura";
function vActividades() {
  const filaAct = (a) => {
    const k = P.claves[a.id], [lab, cls] = ESTACT[a.estado] || [a.estado, ""], mia = a.autor === P.uid, acc = [];
    acc.push(`<a class="btn small ghost" href="imprimir.html?a=${encodeURIComponent(a.id)}${SVB.demo && new URLSearchParams(location.search).has("demo") ? "&demo" : ""}" target="_blank">Papel</a>`);
    if (a.origen === "repo") { if (admin()) acc.push(`<label class="btn small">${k ? "Sustituir" : "Cargar"} clave<input type="file" accept=".json" data-key="${a.id}" hidden></label>`); }
    else {
      if (admin() && a.estado !== "publicada") acc.push(`<button class="btn small primary" data-pub="${a.id}">Publicar</button>`);
      if (admin() && a.estado === "propuesta" && !mia) acc.push(`<button class="btn small" data-dev="${a.id}">Devolver al autor</button>`);
      if (admin() && a.estado === "publicada") acc.push(`<button class="btn small" data-dev="${a.id}">Retirar</button>`);
      if (!admin() && mia && a.estado === "borrador") acc.push(`<button class="btn small primary" data-prop="${a.id}">Proponer</button>`);
      if (!admin() && mia && a.estado === "propuesta") acc.push(`<button class="btn small" data-dev="${a.id}">Retirar propuesta</button>`);
      if (k) acc.push(`<button class="btn small ghost" data-dl="${a.id}">JSON</button>`);
      if (admin() || (mia && a.estado !== "publicada")) acc.push(`<button class="btn small ghost" data-delact="${a.id}">Eliminar</button>`);
    }
    const origen = a.origen === "repo" ? "Repositorio" : `Panel · ${esc(a.autor_nombre || nombreProf(a.autor))}`;
    return `<tr><td>${esc(svT(a.titulo, PANEL_LANG))}<div class="small muted">${origen}</div></td><td><span class="pill ${cls}">${lab}</span></td>
      <td>${k ? `<span class="pill ok">Clave (${Object.keys(k.puntos || {}).length})</span>` : `<span class="pill bad">Sin clave</span>`}</td><td class="n"><div class="acc">${acc.join("")}</div></td></tr>`;
  };
  const grupos = porAsignatura(P.acts), conCab = grupos.length > 1 || (grupos[0] && grupos[0][0]);
  const filas = grupos.map(([k, l]) => (conCab ? `<tr><td colspan="4" class="eyebrow" style="padding-top:14px;text-transform:none;letter-spacing:.04em">${esc(etiquetaAsig(k))}</td></tr>` : "") + l.map(filaAct).join("")).join("");
  const nota = admin()
    ? "Las propuestas del profesorado aparecen aquí: revísalas (JSON, o creando una sesión de prueba) y publícalas. Publicada, cualquier profesor autorizado puede usarla en sus sesiones."
    : "Tus borradores solo los ves tú; puedes probarlos en una sesión. Cuando estén listos, «Proponer» los envía al administrador para que los revise y los publique con tu nombre.";
  return `<section class="panel stack"><h2>Actividades</h2><p class="small muted">${nota} Las claves (puntos de cada opción) nunca se publican en la web: solo las lee el profesorado autorizado.</p>
    <div class="tablebox"><table><thead><tr><th>Actividad</th><th>Estado</th><th>Clave</th><th></th></tr></thead><tbody>${filas || `<tr><td colspan="4" class="muted">No hay actividades.</td></tr>`}</tbody></table></div>
    <div class="row"><button class="btn" data-vista="conversor">Crear actividad desde una hoja Excel</button><a class="btn ghost" href="plantilla/Plantilla_SORTIVIA.xlsx" download>Plantilla en blanco</a><a class="btn ghost" href="proponer.html">Instrucciones</a></div></section>`;
}
function vNueva() {
  const usables = P.acts.filter((a) => a.estado === "publicada" || a.autor === P.uid || admin());
  return `<section class="panel stack"><h2>Nueva sesión</h2><form id="nueva" class="row">
    <select class="field" name="act">${porAsignatura(usables).map(([k, l]) => `<optgroup label="${esc(etiquetaAsig(k))}">${l.map((a) => `<option value="${a.id}">${esc(svT(a.titulo, PANEL_LANG))}${a.estado !== "publicada" ? " (sin publicar: solo para pruebas)" : ""}</option>`).join("")}</optgroup>`).join("")}</select>
    <input class="field" name="nombre" placeholder="Nombre (p. ej., BMSi 2026-27 · grupo A)" style="flex:1;min-width:220px" maxlength="80">
    <button class="btn primary" type="submit">Crear sesión</button></form></section>`;
}
function vSesiones() {
  const abiertas = P.sesiones.filter((s) => s.estado === "abierta"), cerradas = P.sesiones.filter((s) => s.estado !== "abierta");
  const cols = admin() ? 6 : 5;
  const fila = (s) => `<tr><td class="num">${s.id}</td><td>${esc(s.nombre || "")}</td><td>${(() => { const a = P.acts.find((x) => x.id === s.actividad) || {}; return `${a.asignatura ? `<span class="pill">${esc(a.asignatura)}</span> ` : ""}${esc(svT(a.titulo, PANEL_LANG) || s.actividad)}`; })()}</td>${admin() ? `<td class="small">${esc(nombreProf(s.propietario))}</td>` : ""}<td class="small muted">${new Date(s.creada).toLocaleString(PANEL_LANG === "en" ? "en-GB" : "es-ES")}</td><td class="n"><button class="btn small" data-open="${s.id}">Abrir</button></td></tr>`;
  return `<section class="panel stack"><h2>${admin() ? "Sesiones (todas)" : "Tus sesiones"}</h2>${P.sesiones.length ? `<div class="tablebox"><table><thead><tr><th>Código</th><th>Nombre</th><th>Actividad</th>${admin() ? "<th>Profesor</th>" : ""}<th>Creada</th><th></th></tr></thead><tbody>${abiertas.map(fila).join("")}${cerradas.length ? `<tr><td colspan="${cols}" class="small muted">Cerradas</td></tr>${cerradas.map(fila).join("")}` : ""}</tbody></table></div>` : `<p class="muted">Todavía no hay sesiones.</p>`}</section>`;
}
function vMsg() { return P.msg ? `<p class="notice small" role="status">${esc(P.msg)}</p>` : ""; }
function vInicio() { return vTabs() + vMsg() + vNueva() + vSesiones() + vActividades(); }

/* ---------- Estadísticas de uso (solo administrador) ---------- */
async function cargarEst(min = 1) {
  const actividades = Object.fromEntries(P.acts.map((a) => [a.id, { titulo: svT(a.titulo, PANEL_LANG) || a.id, detalle: a.asignatura || "" }]));
  const enviado = (g) => g.estado !== "editando" || (g.ronda || 1) > 1;
  P.est = await bcCargar({ app: "SORTIVIA", B: SVB, adminUids: [...SV_ADMINS, "demo-admin"], actividades, enviado, min }); render();
}
function vEstadisticas() { return vTabs() + vMsg() + `<section class="panel stack"><h2>Estadísticas de uso · SORTIVIA</h2>${bcPanel(P.est, esc)}</section>`; }

/* ---------- Vistas: profesorado (solo administrador) ---------- */
function vProfesorado() {
  const filas = P.profs.slice().sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), "es")).map((p) => `<tr><td><b>${esc(p.nombre || "")}</b><div class="small muted">${esc([p.correo, p.centro].filter(Boolean).join(" · "))}</div></td><td class="uid">${esc(p.uid)}</td>
    <td>${p.activo ? `<span class="pill ok">Autorizado</span>` : `<span class="pill bad">Desactivado</span>`}</td>
    <td class="n"><div class="acc"><button class="btn small" data-tprof="${esc(p.uid)}">${p.activo ? "Desactivar" : "Activar"}</button><button class="btn small ghost" data-dprof="${esc(p.uid)}">Eliminar</button></div></td></tr>`).join("");
  return vTabs() + vMsg() + `<section class="panel stack"><h2>Profesorado autorizado</h2>
    <p class="small muted">Cada profesor entra en este panel con su cuenta de Google. Si no está autorizado, el panel le muestra su identificador (UID) para que te lo envíe; pégalo aquí. Un profesor autorizado puede crear sus propias sesiones (solo ve las suyas y sus grupos), usar las actividades publicadas y convertir y proponer actividades nuevas. No ve los datos de QUAESTIA.</p>
    <div class="tablebox"><table><thead><tr><th>Profesor</th><th>UID</th><th>Estado</th><th></th></tr></thead><tbody>${filas || `<tr><td colspan="4" class="muted">Todavía no has autorizado a nadie.</td></tr>`}</tbody></table></div></section>
    <section class="panel stack"><h3>Autorizar a un profesor</h3><form id="nprof" class="stack">
      <div class="row"><input class="field" name="uid" placeholder="UID (lo ve al entrar en el panel)" required pattern="[A-Za-z0-9_-]{6,128}" style="flex:2;min-width:240px">
      <input class="field" name="nombre" placeholder="Nombre y apellidos" required maxlength="80" style="flex:1;min-width:180px">
      <input class="field" name="correo" type="email" placeholder="Correo (opcional)" maxlength="120" style="flex:1;min-width:180px">
      <input class="field" name="centro" placeholder="Centro (p. ej., Universidad de Granada)" maxlength="120" style="flex:1;min-width:200px"></div>
      <p class="small muted" style="margin:0">El centro solo se usa en las estadísticas de uso. Para añadirlo o cambiarlo a alguien ya autorizado, vuelve a autorizar su UID con el centro.</p>
      <div class="row"><button class="btn primary" type="submit">Autorizar</button></div></form></section>`;
}

/* ---------- Vistas: conversor de hojas Excel ---------- */
function choque(aid) {
  if (P.repo.some((a) => a.id === aid)) return { error: `Ya hay una actividad del repositorio con el id «${aid}». Cambia el parámetro «id» en la pestaña Actividad.` };
  const ex = P.fsActs.find((a) => a.id === aid);
  if (!ex) return {};
  if (!admin() && ex.autor !== P.uid) return { error: `Ya existe una actividad de otra persona con el id «${aid}». Cambia el parámetro «id» en la pestaña Actividad.` };
  if (!admin() && ex.estado === "publicada") return { error: `Tu actividad «${aid}» ya está publicada. Para cambiarla, escribe al administrador (o usa otro id).` };
  return { aviso: `Ya existe «${aid}» (${ex.estado}${ex.autor !== P.uid ? `, de ${ex.autor_nombre || "otra persona"}` : ""}): al guardar se sustituirá.`, ex };
}
function planFilas(act, el) {
  const nc = svCondiciones(act, el), nr = svReplicas(act, el), out = [];
  for (const b of act.bloques) {
    if (!svIncluido(act, el, b)) continue;
    const sel = el.bloques[b.id], cb = svCosteBloque(b, sel, nc, nr);
    b.decisiones.forEach((d, i) => {
      const v = sel.dec[d.id];
      const txt = d.tipo === "contador" ? (Number(v) > 0 ? `${Number(v)} ×` : "—") : svElegidas(d, v).map((o) => svT(o.label, PANEL_LANG)).join(" + ");
      out.push(`<tr><td>${i === 0 ? `<b>${esc(svT(b.nombre, PANEL_LANG))}</b>` : ""}</td><td>${esc(svT(d.nombre, PANEL_LANG))}</td><td>${esc(txt)}</td><td class="n">${i === 0 ? fmt(cb) : ""}</td></tr>`);
    });
  }
  return out.join("");
}
function vConversor() {
  const c = P.conv;
  let cuerpo = "";
  if (c && c.fase === "cargando") cuerpo = `<p class="muted">Leyendo la hoja…</p>`;
  else if (c && c.errores && c.errores.length) cuerpo = `<div class="stack"><p><b>La hoja «${esc(c.archivo)}» tiene ${c.errores.length} problema${c.errores.length > 1 ? "s" : ""}.</b> Corrígelos en el Excel y vuelve a cargarlo:</p><ul class="err">${c.errores.slice(0, 40).map((e) => `<li>${esc(e)}</li>`).join("")}</ul>${c.errores.length > 40 ? `<p class="small muted">…y ${c.errores.length - 40} más.</p>` : ""}</div>`;
  else if (c) {
    const a = c.act, nd = a.bloques.reduce((s, b) => s + b.decisiones.length, 0), no = a.bloques.reduce((s, b) => s + b.decisiones.reduce((t, d) => t + d.opciones.length, 0), 0);
    const ch = choque(a.id);
    cuerpo = `<div class="stack"><p><b>${esc(svT(a.titulo, PANEL_LANG))}</b> <span class="small muted">· id <span class="num">${esc(a.id)}</span></span></p>
      <div class="kv">${a.asignatura ? `<div><b>${esc(a.asignatura)}</b><span>Asignatura</span></div>` : ""}<div><b>${a.bloques.length}</b><span>Bloques</span></div><div><b>${nd}</b><span>Decisiones</span></div><div><b>${no}</b><span>Opciones</span></div><div><b>${c.clave.reglas.length}</b><span>Reglas</span></div><div><b>${fmt(a.presupuesto)}</b><span>Presupuesto</span></div>${a.limite2 ? `<div><b>${svCant(a.limite2.valor, a.limite2.unidad, PANEL_LANG)}</b><span>Segundo límite</span></div>` : ""}<div><b>${c.objetivo}</b><span>Puntos objetivo</span></div></div>
      ${ch.error ? `<p class="notice" style="color:var(--bad)">${esc(ch.error)}</p>` : ch.aviso ? `<p class="small notice">${esc(ch.aviso)}</p>` : ""}`;
    if (c.fase === "optimizando") cuerpo += `<div class="stack"><p class="small">Buscando la mejor estrategia dentro del presupuesto… (unos 30 segundos; no cierres la página)</p><progress id="prog" max="1" value="${c.prog || 0}"></progress></div>`;
    if (c.fase === "hecho") {
      if (!(c.bruto > 0)) cuerpo += `<p class="notice" style="color:var(--bad)">No se ha encontrado ninguna estrategia con puntos positivos dentro del presupuesto. Revisa los precios, los puntos o el presupuesto.</p>`;
      else {

  }
  return vTabs() + vMsg() + `<section class="panel stack"><h2>Crear una actividad desde una hoja Excel</h2>
    <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
      <li>Rellena la <a href="plantilla/Plantilla_SORTIVIA.xlsx" download>plantilla en blanco</a> (pestañas Actividad, Bloques, Opciones y Reglas; las instrucciones están dentro y en la <a href="proponer.html">página de propuestas</a>).</li>
      <li>Cárgala aquí. El panel comprueba la hoja, busca la mejor estrategia posible dentro del presupuesto y ajusta la escala para que esa estrategia obtenga los puntos objetivo.</li>
      <li>${admin() ? "Guárdala como borrador para probarla en una sesión, o publícala directamente." : "Guárdala como borrador, pruébala en una sesión tuya y, cuando esté lista, pulsa «Proponer» en la lista de actividades. El administrador la revisa y la publica con tu nombre."}</li></ol>
    <div class="row"><label class="btn ${c ? "" : "primary"}">${c ? "Cargar otra hoja" : "Cargar hoja Excel (.xlsx)"}<input type="file" id="xls" accept=".xlsx,.xlsm,.xls" hidden></label>${c && c.archivo ? `<span class="small muted">${esc(c.archivo)}</span>` : ""}</div>
    ${cuerpo}</section>`;
}

}

function cell(v) { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function save(name, text, type) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function csvDecisiones() {
  const out = [["sesion", "actividad", "grupo", "ronda", "coste_ronda", "puntos_ronda", "puntos_brutos", "numeros", "elegidos", "sorteo", "resultado", "bloque", "decision", "opcion", "puntos_opcion", "cuenta"].join(",")];
  for (const g of P.grupos) for (const r of g.historial || []) for (const d of r.detalle) out.push([P.sid, P.act.id, g.nombre, r.ronda, r.coste, r.puntos, r.puntos_brutos ?? "", r.numeros, (r.elegidos || []).join(" "), r.sorteo || "", r.resultado || "", d.regla ? "coherencia" : d.bloque, d.regla || d.decision, d.regla ? svT(d.texto, PANEL_LANG) : (d.cantidad != null ? d.cantidad : d.opcion), d.puntos, d.cuenta === false ? 0 : 1].map(cell).join(","));
  return out.join("\n");
}
function csvJust() {
  const out = [["sesion", "grupo", "ronda", "bloque", "justificacion"].join(",")];
  for (const g of P.grupos) for (const r of g.historial || []) for (const [b, t] of Object.entries(r.justif || {})) if (t && t.trim()) out.push([P.sid, g.nombre, r.ronda, b, t].map(cell).join(","));
  return out.join("\n");
}

/* ---------- Conversor: carga perezosa de SheetJS y del conversor ---------- */
function cargarScript(src) { return new Promise((ok, ko) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => ko(new Error("No se ha podido cargar " + src)); document.head.appendChild(s); }); }
async function libsConversor() {
  if (!window.XLSX) await cargarScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");
  if (typeof window.svConvertir !== "function") await cargarScript(`conversor.js?v=${SV_VERSION}`);
}
async function convertir(f) {
  P.msg = ""; P.conv = { fase: "cargando", archivo: f.name }; render();
  await libsConversor();
  const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
  const r = svConvertir(wb); SV_UNIDAD = (r.act && r.act.unidad) || null; SV_UNIDAD2 = (r.act && r.act.limite2 && r.act.limite2.unidad) || null;
  P.conv = { ...r, archivo: f.name, fase: r.errores && r.errores.length ? "error" : "optimizando", prog: 0 };
  render();
  if (P.conv.fase !== "optimizando" || choque(r.act.id).error) { if (P.conv.fase === "optimizando") P.conv.fase = "bloqueado"; return render(); }
  const yo = P.conv;
  const { bruto, plan } = await svOptimizar(r.act, r.clave, r.act.presupuesto, { progreso: (x) => { yo.prog = x; const p = $("#prog"); if (p) p.value = x; } });
  if (P.conv !== yo) return;   // se cargó otra hoja mientras tanto
  yo.bruto = bruto; yo.plan = plan; yo.fase = "hecho";
  if (bruto > 0) yo.clave.escala = { objetivo: yo.objetivo, maximo: bruto, presupuesto: r.act.presupuesto };
  render();
}
async function guardarConv(estado) {
  const c = P.conv, aid = c.act.id, ch = choque(aid);
  if (ch.error) throw new Error(ch.error);
  const ex = ch.ex;
  const doc = { datos: c.act, autor: ex ? ex.autor : P.uid, autor_nombre: ex ? (ex.autor_nombre || "") : P.nombre, estado, actualizado: Date.now() };
  await SVB.guardarActividad(aid, doc);
  await SVB.guardarClave(aid, c.clave);
  P.conv = null; P.vista = "inicio";
  P.msg = estado === "publicada" ? `«${svT(c.act.titulo, PANEL_LANG)}» publicada: ya se puede usar en cualquier sesión.` : `«${svT(c.act.titulo, PANEL_LANG)}» guardada como borrador. Pruébala creando una sesión${admin() ? "" : " y, cuando esté lista, pulsa «Proponer»"}.`;
  await cargarActividades(); render();
}
async function descargarAct(aid) {
  const fsa = P.fsActs.find((a) => a.id === aid), act = fsa ? fsa.datos : await svCargarActividad(aid), clave = P.claves[aid];
  save(`${aid}.json`, JSON.stringify(act, null, 1), "application/json");

async function abrir(sid) {
  P.sid = sid; P.ses = P.sesiones.find((s) => s.id === sid) || await SVB.sesion(sid); P.act = await svCargarActividad(P.ses.actividad); P.grupos = []; P.open = new Set(); P.msg = "";
  if (!P.claves[P.act.id]) P.claves[P.act.id] = await SVB.clave(P.act.id).catch(() => null);
  P.sol = P.claves[P.act.id] ? svSolucion(P.act, P.claves[P.act.id]) : null;
  SVB.verSesion(sid, (se) => { if (P.sid !== sid || !se) return; P.ses = { ...P.ses, ...se }; render(); });
  SVB.verGrupos(sid, (gs) => { if (P.sid !== sid) return; P.grupos = gs; render(); arbitrar(); });
  render();
}
async function entrar() {
  const u = await SVB.entrarAdmin();
  P.uid = u.uid; P.email = u.email || "";
  P.rol = await SVB.rol(u.uid);
  if (!P.rol) {
    $("#who").textContent = P.email;
    $("#main").innerHTML = `<section class="panel stack"><h2>Cuenta no autorizada</h2>
      <p>Esta cuenta (${esc(P.email)}) todavía no tiene acceso al panel. Para usar SORTIVIA con tus grupos, envía al administrador (b22olaba@uco.es) tu nombre, tu centro y este identificador:</p>
      <div class="row"><input class="field uid" id="miuid" readonly value="${esc(P.uid)}" style="flex:1"><button class="btn small" id="copiar-uid">Copiar</button></div>
      <p class="small muted">Cuando te autorice, vuelve a entrar. Mientras tanto, puedes <a href="proponer.html">proponer una actividad</a> sin cuenta.</p></section>`;

  }

  P.nombre = (perfil && perfil.nombre) || u.nombre || P.email;

async function accion(t) {
  if (t.id === "signin") return entrar();
  if (t.id === "copiar-uid") { try { await navigator.clipboard.writeText(P.uid); t.textContent = "Copiado"; } catch (er) { $("#miuid").select(); } return; }
  if (t.dataset.vista) { P.vista = t.dataset.vista; P.msg = ""; if (P.vista === "profesorado") await cargarProfes(); if (P.vista === "estadisticas") { P.est = null; render(); return cargarEst(); } return render(); }
  if (t.id === "bc-csv") return save(`sortivia_estadisticas_${new Date().toISOString().slice(0, 10)}.csv`, "\uFEFF" + bcCSV(P.est.r), "text/csv");
  if (t.id === "bc-print") { if (!bcImprimir(P.est.r, esc)) { P.msg = "El navegador ha bloqueado la ventana: permite las ventanas emergentes para este sitio."; render(); } return; }
  if (t.dataset.open) return abrir(t.dataset.open);
  if (t.id === "volver") { P.sid = null; P.msg = ""; await cargarSesiones(); return render(); }
  if (t.id === "copiar") { try { await navigator.clipboard.writeText($("#link").value); P.msg = "Enlace copiado."; } catch (er) { $("#link").select(); } return render(); }
  if (t.id === "solucion") {
    const nuevo = P.ses.solucion ? null : svSolucion(P.act, P.claves[P.act.id]);
    await SVB.cambiarSesion(P.sid, { solucion: nuevo }); P.ses.solucion = nuevo; return render();
  }
  if (t.id === "cerrar") { await SVB.cerrarSesion(P.sid); P.ses.estado = "cerrada"; return render(); }
  if (t.dataset.reabrir) return SVB.cambiarGrupoAdmin(P.sid, t.dataset.reabrir, { estado: "editando", aviso: null });
  if (t.dataset.reset) return SVB.cambiarGrupoAdmin(P.sid, t.dataset.reset, { estado: "editando", ronda: 1, puntos: null, numeros: null, sorteo: null, elegidos: [], historial: [], aviso: null });
  if (t.dataset.borrar) return SVB.borrarGrupo(P.sid, t.dataset.borrar);
  // Actividades
  const titulo = (aid) => svT((P.acts.find((a) => a.id === aid) || {}).titulo, PANEL_LANG) || aid;
  if (t.dataset.pub) { await SVB.cambiarActividad(t.dataset.pub, { estado: "publicada", actualizado: Date.now() }); P.msg = `«${titulo(t.dataset.pub)}» publicada.`; await cargarActividades(); return render(); }
  if (t.dataset.prop) { await SVB.cambiarActividad(t.dataset.prop, { estado: "propuesta", actualizado: Date.now() }); P.msg = `«${titulo(t.dataset.prop)}» enviada al administrador para su revisión.`; await cargarActividades(); return render(); }
  if (t.dataset.dev) { await SVB.cambiarActividad(t.dataset.dev, { estado: "borrador", actualizado: Date.now() }); P.msg = `«${titulo(t.dataset.dev)}» ha vuelto a borrador.`; await cargarActividades(); return render(); }
  if (t.dataset.dl) return descargarAct(t.dataset.dl);
  if (t.dataset.delact) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "¿Seguro? Pulsa otra vez"; return; }
    const tt = titulo(t.dataset.delact);
    await SVB.borrarActividad(t.dataset.delact); P.msg = `«${tt}» eliminada.`; await cargarActividades(); return render();
  }
  // Conversor
  if (t.id === "c-pub") return guardarConv("publicada");
  if (t.id === "c-bor") return guardarConv("borrador");
  if (t.id === "c-dl") { save(`${P.conv.act.id}.json`, JSON.stringify(P.conv.act, null, 1), "application/json"); setTimeout(() => save(`${P.conv.act.id}.clave.json`, JSON.stringify(P.conv.clave, null, 1), "application/json"), 300); return; }
  // Profesorado
  if (t.dataset.tprof) { const p = P.profs.find((x) => x.uid === t.dataset.tprof); await SVB.guardarProfesor(p.uid, { activo: !p.activo }); await cargarProfes(); return render(); }
  if (t.dataset.dprof) {
    if (t.dataset.confirm !== "1") { t.dataset.confirm = "1"; t.textContent = "¿Seguro? Pulsa otra vez"; return; }
    await SVB.borrarProfesor(t.dataset.dprof); await cargarProfes(); return render();
  }
  const stamp = new Date().toISOString().slice(0, 10);
  if (t.id === "csv") return save(`sortivia_${P.act.id}_${P.sid}_decisiones_${stamp}.csv`, csvDecisiones(), "text/csv");
  if (t.id === "csvj") return save(`sortivia_${P.act.id}_${P.sid}_justificaciones_${stamp}.csv`, csvJust(), "text/csv");
  if (t.id === "json") return save(`sortivia_${P.act.id}_${P.sid}_${stamp}.json`, JSON.stringify({ sesion: { id: P.sid, ...P.ses }, actividad: P.act.id, grupos: P.grupos }, null, 1), "application/json");
}
function fallo(er) {
  const txt = er.code === "permission-denied" ? "Firebase no permite esta operación con tu cuenta (¿están publicadas las reglas nuevas de Firestore?)." : (er.code || er.message);
  const m = $("#err"); if (m) m.textContent = `Error: ${txt}`; else { P.msg = `Error: ${txt}`; if (P.conv && P.conv.fase === "cargando") P.conv = null; render(); }
}
document.addEventListener("click", (e) => { const t = e.target.closest("button"); if (t) accion(t).catch(fallo); });
document.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset && d.dataset.g) { if (d.open) P.open.add(d.dataset.g); else P.open.delete(d.dataset.g); } }, true);
document.addEventListener("change", async (e) => {
  if (e.target.id === "auto") { P.auto = e.target.checked; return arbitrar(); }
  if (e.target.id === "bc-min") { bcRecalcular(P.est, Number(e.target.value)); return render(); }
  if (e.target.id === "xls") { const f = e.target.files[0]; if (f) convertir(f).catch(fallo); return; }
  if (e.target.dataset.key) {
    const aid = e.target.dataset.key, f = e.target.files[0]; if (!f) return;
    try { const k = JSON.parse(await f.text()); if (!/^sortivia-clave\/[123]$/.test(k.schema || "") || k.actividad !== aid) throw new Error("Este archivo no es la clave de esta actividad."); await SVB.guardarClave(aid, k); P.claves[aid] = k; if (P.act && P.act.id === aid) P.sol = svSolucion(P.act, k); P.msg = "Clave cargada."; render(); }
    catch (er) { P.msg = er.message; render(); }
  }
});
document.addEventListener("submit", (e) => {
  const f = e.target; e.preventDefault();
  (async () => {
    if (f.id === "nueva") { if (!f.act.value) return; const sid = await SVB.crearSesion({ actividad: f.act.value, nombre: f.nombre.value.trim() }); await cargarSesiones(); return abrir(sid); }
    if (f.id === "nprof") {
      const uid = f.uid.value.trim();
      await SVB.guardarProfesor(uid, { nombre: f.nombre.value.trim(), correo: f.correo.value.trim(), centro: f.centro.value.trim(), activo: true, alta: Date.now() });
      P.msg = `${f.nombre.value.trim()} ya puede entrar en el panel.`; await cargarProfes(); render();
    }
  })().catch(fallo);
});
if (SVB.demo) $("#signin").click();
</script>
</body>
